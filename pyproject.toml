[project]
name = "housing-intelligence"
version = "0.1.0.dev0"
description = "NJ-first housing intelligence platform: public data to curated warehouse to analytics"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "duckdb>=1.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "geoalchemy2>=0.15",
]

[project.scripts]
hip = "hip.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
    # Validates emitted packets against `schemas/packet-v1.json` as an external consumer
    # would. Dev-only on purpose: `hip pack` re-parses through the Pydantic model that
    # generated the schema, so the runtime needs no second validator.
    "jsonschema>=4.22",
]
# Apple-silicon only, and only needed to run local models for the Milestone 8
# evaluation. Its own group for the same reason dbt has one: mlx pins a numpy/
# transformers tree that must not constrain the application environment, and a
# non-macOS checkout must still be able to `uv sync` the rest.
mlx = [
    "mlx-lm>=0.29",
]
# The judge for `hip eval judge`, and nothing else. Kept out of the application
# dependencies deliberately: SPEC requires the platform stay fully useful with the AI
# layer disabled, so no runtime import path may depend on an LLM client being present
# (ARCHITECTURE #56). Separate from `mlx` because this one installs anywhere.
eval = [
    "anthropic>=0.40",
]
# dbt resolves against its own pinned dependency tree; keeping it in a separate group
# stops it from constraining the application environment (ARCHITECTURE #4).
dbt = [
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "dbt-postgres>=1.8",
]

[tool.uv]
# `uv run` syncs the environment to the default groups before every command, so
# without this line each `uv run` silently uninstalls whatever the last explicit
# `uv sync --group ...` added. `make setup` installed dbt and the next `uv run mypy`
# removed it again, which surfaced as an import-not-found on dbt.cli.main. dbt is
# named here because `make pipeline` needs it at runtime; `mlx` and `eval` stay
# opt-in and are handled by the mypy overrides below instead.
default-groups = ["dev", "dbt"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hip"]

[tool.ruff]
line-length = 90
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["hip"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["duckdb.*"]
ignore_missing_imports = true

# Apple-silicon only and installed from the optional `mlx` group, so a checkout without
# that group must still type-check. `hip.eval.runners.mlx_runner` imports these inside
# functions for the same reason (ARCHITECTURE #55).
[[tool.mypy.overrides]]
module = ["mlx.*", "mlx_lm.*"]
ignore_missing_imports = true

# Installed from the optional `eval` group, and deliberately not a default: SPEC
# requires the platform stay fully useful with the AI layer disabled, so no runtime
# import path may depend on an LLM client being present (ARCHITECTURE #56). Same
# argument as the mlx override above — a checkout without the group must still
# type-check. `hip.eval.judge` is the only importer.
[[tool.mypy.overrides]]
module = ["anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Tests import `hip` from the source tree directly rather than relying on the editable
# install, so a half-built venv fails at `uv sync` instead of as a confusing collection
# error (see ARCHITECTURE #18).
pythonpath = ["src"]
# Starlette's TestClient wants httpx2. Third-party and not actionable here; revisit
# when adopting httpx2 (tracked in TODO.md). Category is StarletteDeprecationWarning,
# so this matches on message only.
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
