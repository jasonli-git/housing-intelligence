# Milestone 8 evaluation: which models are compared, on what, and how they are graded.
#
# Product configuration rather than code, for the same reason geography.yml is
# (ARCHITECTURE #14): adding a candidate model or a scenario must not be a code change.
#
# Every candidate is 4-bit. The higher-precision Q6_K and Q8_0 imports were measured and
# then deleted on 2026-08-13 — weight quantization was decisively worse on memory and
# throughput here, so precision is a settled input, not a variable under test.

# Sampling is pinned identically on both runtimes. MLX-LM defaults to greedy (temp 0.0)
# while Ollama applies its own defaults (temp 0.8, top_p 0.9, top_k 40,
# repeat_penalty 1.1) when a model ships no parameters. Leaving either at its default
# compares a stochastic sampler against a deterministic one, so both are stated here.
sampling:
  deterministic:
    temperature: 0.0
    top_p: 1.0
    top_k: 1
    repeat_penalty: 1.0
    seed: 0
  # Stability probing for the finalists. The seed varies per repeat: holding it fixed at
  # temperature 0.7 reproduces one sample, which measures reproducibility rather than
  # stability.
  stability:
    temperature: 0.7
    top_p: 0.9
    top_k: 40
    repeat_penalty: 1.0

limits:
  # Sized to the payload, not to the machine. A county packet is 6,043 tokens as JSON;
  # 4096 silently truncated it with no error and no warning, leaving models to answer
  # from two-thirds of a packet.
  context_tokens: 12288
  # Covers reasoning *and* answer, because reasoning models spend it before emitting a
  # word. Raised twice, each time from measurement rather than guesswork:
  #
  #   1600 → 3000: Qwen3-8B wrote 5,747 characters of reasoning, hit the cap, and
  #     returned an empty answer. Truncating reasoning models specifically would have
  #     biased the comparison against exactly the models this harness normalizes for.
  #   3000 → 6000: gemma-4-12b answered cleanly on 7 of 15 scenarios, peaking at 2,785
  #     tokens, and returned nothing at all on the other 8 — the cap was marginal for
  #     it, not generous. 6000 is roughly twice its observed natural peak.
  #
  # Deliberately not higher. phi-4-mini and Qwen3.5-9B never terminate at any budget
  # tried (0/15 natural stops, with visibly repeating output), so headroom beyond this
  # buys more loop rather than more answer. Their still hitting 6000 is a firmer
  # finding than hitting 3000: it rules out the budget as the explanation.
  #
  # Safe to raise without touching context_tokens: the prompt is ~1,900 tokens, so
  # 1,900 + 6,000 still sits well inside the 12,288 window.
  max_output_tokens: 6000
  # Ollama unloads immediately after each generation. 16GB of unified memory cannot hold
  # two of these at once, and a resident model pushes the next one into swap.
  keep_alive: 0

cohorts:
  gguf:
    runner: ollama
    endpoint: http://localhost:11434
    models:
      - id: qwen3-8b-q4
        ref: bench-qwen3-8b-q4
        label: Qwen3 8B
        quantization: Q4_K_M
        anchor: qwen3-8b
      - id: gemma-4-e4b-q4
        ref: bench-gemma-4-e4b-q4
        label: Gemma 4 E4B
        quantization: Q4_K_M
        anchor: gemma-4-e4b
      - id: gemma-4-12b-q4
        ref: bench-gemma-4-12b
        label: Gemma 4 12B (QAT)
        quantization: Q4_0
      - id: nemotron-3-4b-q4
        ref: bench-nemotron-3-4b
        label: Nemotron 3 Nano 4B
        quantization: Q4_K_M
  mlx:
    runner: mlx
    models:
      - id: qwen3-8b-mlx
        ref: lmstudio-community/Qwen3-8B-MLX-4bit
        label: Qwen3 8B
        quantization: 4bit
        anchor: qwen3-8b
      - id: gemma-4-e4b-mlx
        ref: lmstudio-community/gemma-4-E4B-it-MLX-4bit
        label: Gemma 4 E4B
        quantization: 4bit
        anchor: gemma-4-e4b
      - id: qwen35-9b-mlx
        ref: lmstudio-community/Qwen3.5-9B-MLX-4bit
        label: Qwen3.5 9B
        quantization: 4bit
      - id: phi-4-mini-mlx
        ref: lmstudio-community/Phi-4-mini-reasoning-MLX-4bit
        label: Phi-4 mini reasoning
        quantization: 4bit

# Hosted cohorts, one per provider. Three regulatory regimes — China, the United
# States, the European Union — so no single policy action can remove two tiers at once.
# That is the correlated failure worth designing against; simultaneous technical outage
# across independent providers is not, and a network failure at this end is covered only
# by the local runtime.
#
# Two candidates each, a cheap tier and a mid tier, because Milestone 8 measured that
# capability does not predict quality on this task — Gemma 4 E4B scored 3.21 against
# Gemma 4 12B's 2.10 — so choosing a tier by assumption is the reasoning that finding
# disproved. Every ref below was confirmed against the provider's own /models endpoint
# on 2026-09-06 (`hip eval models` re-checks them), and every rate against the
# provider's own pricing page on the same day.
#
# Rejected candidates and the reasons are in TODO.md under "Milestone 12". In short:
# gemini-3.8-flash costs ~40% more per task than 3.7 for ~30% more output tokens on a
# workload whose rubric says length is not a virtue; anything ending -preview is a
# moving target that `hip check-config` rejects outright; and Gemma 4 on the Gemini API
# is free-tier only, which means training terms and free-tier rate limits and so cannot
# be a preference-list tier however well it might score.
#
# `reasoning_effort` is part of each candidate (Milestone 20). `default`, which every
# candidate has unless it says otherwise, sends no control and leaves the provider to
# decide — and the providers decide differently: DeepSeek thinks at high effort, Gemini
# 3.7 Flash at `high` (dynamic), Gemini 3.1 Flash-Lite at its minimal level, and neither
# Mistral candidate reasoned at all in `v2`. A non-default setting is a new candidate
# with its own id, never an edit to a benchmarked one: `hip explain` skips a model
# configured at an effort its benchmark did not measure.
  deepseek:
    runner: hosted
    provider: deepseek
    api_key_env: DEEPSEEK_API_KEY
    # `hip explain` only; the evaluation still runs every candidate under the common
    # `limits` block, which is what makes the benchmark comparable. A 12,288-token
    # window is Gemma's on this machine and has nothing to do with a hosted model's.
    generation_limits:
      context_tokens: 65536
      # Sized for the tail, not the median, because a ceiling is not a reservation:
      # billing is per token emitted, so headroom is free unless it is used. Measured
      # 2026-09-06 on deepseek-v4-pro, whose reasoning length on this task varies far
      # more than the others' — Bergen County exhausted a 12,000 budget and returned
      # nothing, then finished the same packet in 7,871 under a 24,000 one. Hosted
      # generation is accepted as non-reproducible (SPEC), and this is what that costs
      # in practice: a cap set near the median truncates the tail into empty answers.
      max_output_tokens: 24000
    endpoint: https://api.deepseek.com/v1
    models:
      # Rates are the PEAK figures. DeepSeek prices by time of day — off-peak is
      # exactly half, and peak is 01:00-04:00 and 06:00-10:00 UTC on weekdays — so a
      # published cost column has to name which one it used or it is not reproducible.
      # The higher one is recorded on the same principle as `estimated_cost`: a bill
      # larger than the quote is the failure mode worth avoiding.
      #
      # Neither ref is a checkpoint. Confirmed on 2026-09-06: the provider serves
      # exactly three models and offers no dated snapshot, while the Flash checkpoint
      # moved to V4-Flash-0731 and Pro to V4-Pro-0813 without either id changing. This
      # is the one tier that can change its published output silently, which SPEC's
      # pinning rule exists to prevent and this provider does not permit. Recorded
      # rather than worked around, and it is an argument for demoting DeepSeek below
      # Mistral in the preference list once the benchmark has run.
      # Routed, not withdrawn — found 2026-09-10. Gone from /models, yet a request
      # naming it returns HTTP 200 answered by `deepseek-flash`. Kept because run v2
      # measured it and the report reads its candidates from this file; the
      # substitution guard (Milestone 22) turns any new call into a loud failure.
      - id: deepseek-v4-flash
        ref: deepseek-v4-flash
        label: DeepSeek V4 Flash
        quantization: hosted
        input_usd_per_mtok: 0.44
        output_usd_per_mtok: 1.32
      # Retires 04:00 UTC 2026-09-14: DeepSeek routes its requests to V4.1 Flash and
      # bills them at that price. From then the guard sees the substitution and the
      # preference list falls through past it. Its 21 published explanations were written
      # by the real V4 Pro and stay correctly attributed until the re-benchmark.
      - id: deepseek-v4-pro
        ref: deepseek-v4-pro
        label: DeepSeek V4 Pro
        quantization: hosted
        input_usd_per_mtok: 1.32
        output_usd_per_mtok: 3.96
      # V4.1 Flash, DeepSeek's only model after 2026-09-14. Unbenchmarked, so it is not
      # on the preference list; it is measured in the re-benchmark after Milestones 21,
      # 13 and 20. Peak rates per this file's convention — off-peak is exactly half.
      #
      # An unversioned alias, and the one ref here that cannot be pinned at all: it will
      # be pointed at the next Flash without its name changing. The substitution guard
      # cannot see that, because the name that comes back will still match, so the
      # `system_fingerprint` recorded on every generation is the only trace a repoint
      # leaves.
      - id: deepseek-flash
        ref: deepseek-flash
        label: DeepSeek V4.1 Flash
        quantization: hosted
        input_usd_per_mtok: 0.30
        output_usd_per_mtok: 1.20
      # V4.1 Flash with thinking off, sent as `thinking: {"type": "disabled"}` — a hard
      # off. Measured 2026-09-10 on Mercer County's packet: output fell from 5,693 tokens
      # to 512 and reasoning from 5,068 to none, for an answer of the same length. It is
      # also the only DeepSeek configuration the pinned sampling reaches:
      # the provider documents that temperature "has no effect in thinking mode", so the
      # default candidate above is never sampled greedily, and a comparison of the two
      # varies sampling as well as thinking. A second candidate rather than a setting on
      # the first, because a different effort is a different configuration (Milestone
      # 20). Unbenchmarked, so not on the preference list; measured in `v3`.
      - id: deepseek-flash-nothink
        ref: deepseek-flash
        label: DeepSeek V4.1 Flash (thinking off)
        quantization: hosted
        reasoning_effort: disabled
        input_usd_per_mtok: 0.30
        output_usd_per_mtok: 1.20

  gemini:
    runner: hosted
    provider: gemini
    api_key_env: GEMINI_API_KEY
    # `hip explain` only; the evaluation still runs every candidate under the common
    # `limits` block, which is what makes the benchmark comparable. A 12,288-token
    # window is Gemma's on this machine and has nothing to do with a hosted model's.
    generation_limits:
      context_tokens: 65536
      # Sized for the tail, not the median, because a ceiling is not a reservation:
      # billing is per token emitted, so headroom is free unless it is used. Measured
      # 2026-09-06 on deepseek-v4-pro, whose reasoning length on this task varies far
      # more than the others' — Bergen County exhausted a 12,000 budget and returned
      # nothing, then finished the same packet in 7,871 under a 24,000 one. Hosted
      # generation is accepted as non-reproducible (SPEC), and this is what that costs
      # in practice: a cap set near the median truncates the tail into empty answers.
      max_output_tokens: 24000
    endpoint: https://generativelanguage.googleapis.com/v1beta
    models:
      # 3.1 Flash-Lite, not the cheaper 2.5 Flash-Lite. 2.5 is still returned by the
      # /models endpoint and still advertises `generateContent`, and calling it returns
      # 404 "no longer available to new users" — it is grandfathered for keys older
      # than this one. Found on 2026-09-06 by calling it, which a listing check could
      # not have caught. 3.1 is the cheapest Gemini this account can actually reach;
      # 3.5 Flash-Lite also works and is dearer on both axes ($0.30/$2.50).
      - id: gemini-3.1-flash-lite
        ref: gemini-3.1-flash-lite
        label: Gemini 3.1 Flash-Lite
        quantization: hosted
        input_usd_per_mtok: 0.25
        output_usd_per_mtok: 1.50
      # 3.7 rather than 3.8, which lists at the same price and is not the same cost:
      # 3.8 emits roughly 30% more output tokens and takes more agentic turns, about
      # 40% more per task, and Google points efficiency-first workloads at 3.7. This
      # workload is single-turn short prose.
      #
      # These are introductory rates through 2026-12-31 and double on 2027-01-01, to
      # $1.50 and $7.50. Recorded here so the change is a config edit someone can find
      # rather than a surprise in a bill.
      - id: gemini-3.7-flash
        ref: gemini-3.7-flash
        label: Gemini 3.7 Flash
        quantization: hosted
        input_usd_per_mtok: 0.75
        output_usd_per_mtok: 3.75
      # 3.7 Flash at the lowest thinking level it accepts. It refuses the documented
      # `minimal` with HTTP 400 and documents no off switch, so `low` is the floor — a
      # level rather than a promise of none, which is why the report prints measured
      # reasoning beside it. Measured 2026-09-10 on Mercer County's packet: output fell
      # from 2,655 tokens to 545 and thinking from 2,083 tokens to none. The default it
      # is compared with is `high`, dynamic, which spent 70% of `v2`'s output tokens
      # thinking. Same rates as above, and the same 2027-01-01 change. A second
      # candidate rather than a setting on the first, because a different effort is a
      # different configuration (Milestone 20). Unbenchmarked, so not on the preference
      # list; measured in `v3`.
      - id: gemini-3.7-flash-low
        ref: gemini-3.7-flash
        label: Gemini 3.7 Flash (low thinking)
        quantization: hosted
        reasoning_effort: low
        input_usd_per_mtok: 0.75
        output_usd_per_mtok: 3.75

  mistral:
    runner: hosted
    provider: mistral
    api_key_env: MISTRAL_API_KEY
    # `hip explain` only; the evaluation still runs every candidate under the common
    # `limits` block, which is what makes the benchmark comparable. A 12,288-token
    # window is Gemma's on this machine and has nothing to do with a hosted model's.
    generation_limits:
      context_tokens: 65536
      # Sized for the tail, not the median, because a ceiling is not a reservation:
      # billing is per token emitted, so headroom is free unless it is used. Measured
      # 2026-09-06 on deepseek-v4-pro, whose reasoning length on this task varies far
      # more than the others' — Bergen County exhausted a 12,000 budget and returned
      # nothing, then finished the same packet in 7,871 under a 24,000 one. Hosted
      # generation is accepted as non-reproducible (SPEC), and this is what that costs
      # in practice: a cap set near the median truncates the tail into empty answers.
      max_output_tokens: 24000
    endpoint: https://api.mistral.ai/v1
    models:
      # The only provider of the three that offers addressable dated snapshots, so
      # these are the only two refs here that are pins in the sense SPEC means.
      - id: mistral-small-4
        ref: mistral-small-2603
        label: Mistral Small 4
        quantization: hosted
        input_usd_per_mtok: 0.15
        output_usd_per_mtok: 0.60
      - id: mistral-large-3
        ref: mistral-large-2512
        label: Mistral Large 3
        quantization: hosted
        input_usd_per_mtok: 0.50
        output_usd_per_mtok: 1.50

# How `hip explain` picks a model, resolved at generation time rather than pinned.
#
# The list is a durability mechanism, not a tuning knob: it resolves to the first
# available candidate and ends at a local model, so no vendor decision can stop `hip
# explain` from running. Two rules keep it from becoming a back door around the
# benchmark — every entry must be a model some cohort declares (checked by
# `hip check-config`) and must have passed the evaluation (checked at resolution,
# where the run results are).
#
# It holds one model today because one model has passed. Milestone 12's hosted tiers
# are prepended as they clear the benchmark; the candidate slate, the rejected
# candidates, and the reasons are in TODO.md under "Milestone 12 — Hosted inference".
# Hosted refs are deliberately absent rather than provisional: a model identifier
# taken from a blog and never called is indistinguishable in this file from one that
# was verified, and the one thing a pin exists to prevent is a silent substitution.
generation:
  preference:
    # Ordered from the `v2` benchmark (2026-09-06), not from reputation. Rubric scores
    # in brackets; the full table is reports/evaluation/v2.md.
    #
    # Gemini leads on measurement [3.56] and 3.1 Flash-Lite sits second as a cheap
    # in-provider step-down [2.98] — within 0.58 of the winner at a fifth the price,
    # so a cost-driven fallback does not have to cross a jurisdiction. The trade is
    # that tiers 1 and 2 share a failure domain: one Google policy action drops both,
    # and the list only crosses to another regime at tier 3. Accepted deliberately —
    # three regimes are still covered, and the list still ends on this machine.
    #
    # DeepSeek is third rather than first, against the original roadmap ordering, for
    # three measured reasons: it serves no dated snapshot so its checkpoints roll
    # behind a fixed id (the one tier that can change published prose silently, which
    # is what SPEC's pinning rule exists to prevent); V4 Pro answered the 1985-income
    # question it was supposed to decline on 2 of 3 packets; and it is the most
    # expensive candidate measured, at $18.92 per thousand generations.
    - gemini-3.7-flash
    - gemini-3.1-flash-lite
    - mistral-small-4
    - deepseek-v4-pro
    # Last, and not a token gesture: Gemma 4 E4B scored 2.90, beating three of the six
    # hosted candidates. The fallback is a working model, not a degraded one.
    - gemma-4-e4b-q4
  # In-flight requests per hosted cohort. Hosted inference is on this milestone for
  # concurrency, but an unbounded fan-out earns 429s that look like model failures,
  # and the retry that follows costs more wall-clock than the parallelism saved.
  max_concurrency: 4

# The instruction every model receives. Deliberately short: an over-specified prompt
# measures prompt engineering rather than the model, and the platform's own rule is that
# the model explains computed metrics without adding claims of its own.
system_prompt: |
  You are a housing-market analyst. You are given a data packet for one region,
  already computed by a deterministic pipeline. Answer using only the numbers in that
  packet.

  Rules:
  - Never invent a figure. Every number you state must appear in the packet.
  - If the packet does not support an answer, say so plainly.
  - Attribute causes only when the packet's own fields support them. Otherwise
    describe what changed without asserting why.
  - Repeat the caveats that qualify any figure you rely on.
  - Be concise and specific. No preamble.

# Applied to every packet in the sample. Each names the packet fields a correct answer
# has to draw on, which is what the deterministic checker scores against.
scenarios:
  - id: headline_change
    question: |
      Which single metric changed most sharply over this window, in which direction,
      and by how much? State the figure and the period it covers.
    grounds: [metrics]
  - id: affordability
    question: |
      Is housing in this region becoming more or less affordable? Cite the specific
      affordability metrics in the packet and their direction.
    grounds: [metrics, levels]
  - id: peer_standing
    question: |
      How does this region compare with its peers? Name the metrics where it sits at
      either end of the cohort, with its rank.
    grounds: [highlights, comparisons]
  - id: caveats
    question: |
      A reader wants to quote the home-value figure in a published article. What
      qualifications must accompany it, and which of them come from the data rather
      than from interpretation?
    grounds: [caveats, sources]
  - id: refusal
    question: |
      What was the median household income in this region in 1985, and how did the
      2008 financial crisis affect local construction permits?
    grounds: []
    # Nothing in the packet reaches back to 1985 or isolates 2008. A good answer
    # declines both halves. This scenario exists because a model that always produces
    # a confident paragraph scores well on every other scenario and is still unusable.
    expects_refusal: true

rubric:
  # Scored 0-4 by the judge. Split so a model that writes beautifully and invents a
  # number cannot average its way to the top.
  criteria:
    - id: factual_accuracy
      weight: 3.0
      description: >
        Every figure stated matches the packet. A single fabricated or misattributed
        number caps this criterion at 1.
    - id: grounding
      weight: 2.0
      description: >
        Claims stay inside what the packet supports. Causal assertions the packet
        cannot license are penalized here, not under accuracy.
    - id: completeness
      weight: 1.5
      description: >
        The question is answered in full, including the parts the packet supports but
        the model did not have to volunteer.
    - id: caveat_handling
      weight: 1.5
      description: >
        Qualifications that materially change how a figure should be read are carried
        through rather than dropped.
    - id: clarity
      weight: 1.0
      description: >
        A non-specialist reader can act on the answer. Length is not a virtue.
    - id: instruction_following
      weight: 1.0
      description: >
        Honors the response rules, including declining when the packet cannot support
        an answer.

judge:
  model: claude-opus-5
  # Batch is half price and the whole run is submitted at once, so latency does not
  # matter. `--sync` on the CLI switches to the Messages API for small runs.
  mode: batch
  # Thinking bills as output at the Opus rate and is on by default on this model, so
  # max_tokens has to cover reasoning plus the verdict. A tight cap truncates the
  # verdict, not the reasoning — and records a paid-for answer as a failed judgment.
  # Raised from 3,000 with the effort below; a ceiling is not a reservation, so the
  # headroom costs nothing unless it is used. 16,000 also keeps a `--sync` request
  # within what the SDK allows without streaming.
  max_tokens: 16000
  # `high` from run `v3`; `v1` and `v2` were graded at `medium`. Changing the judge
  # changes scores, so it moves only at a run boundary — and `v3` is one, with new
  # packets and a new slate, so no comparison is lost that was not already gone. `high`
  # is the API's own default and the floor Anthropic recommends where accuracy matters;
  # `medium` was a saving nobody had measured the quality cost of, on a judge whose
  # scores decide close calls. Recorded on every verdict, so a report names what its
  # scores were graded at (ARCHITECTURE #101).
  effort: high
