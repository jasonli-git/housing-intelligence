        - {day: 2026-12-29, covers: October 2026}
        - {day: 2027-01-26, covers: November 2026}
        - {day: 2027-02-23, covers: 2026 Q4}
        - {day: 2027-03-30, covers: January 2027}
        - {day: 2027-04-27, covers: February 2027}
        - {day: 2027-05-25, covers: 2027 Q1}
        - {day: 2027-06-29, covers: April 2027}
        - {day: 2027-07-27, covers: May 2027}
        - {day: 2027-08-31, covers: 2027 Q2}
        - {day: 2027-09-28, covers: July 2027}
        - {day: 2027-10-26, covers: August 2027}
        - {day: 2027-11-30, covers: 2027 Q3}
        - {day: 2027-12-28, covers: October 2027}
    name: House Price Index
    publisher: Federal Housing Finance Agency
    license: Public domain (U.S. Government work)
    licence_class: public_domain
    commercial:
      ads: allowed
      paid: allowed
      note: >-
        A U.S. Government work, with no copyright to licence (17 U.S.C. 105); its
