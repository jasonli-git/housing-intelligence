# Public data source registry. One entry per source; adapters are implemented at
# Milestone 2 and later. `url` is the publisher's stable landing or API root — the exact
# file URL for a given vintage is the adapter's job, because publishers rename files.
# Nothing here is fetched until `hip acquire` runs.
#
# `fallback` (Milestone 26, required) is what to do the day a source stops answering: a
# second publisher, another route to the same data, or keeping the last release labelled
# historical. Internal: it is never loaded into the warehouse or shown on the site. The
# procedure it plugs into is README's "When a source stops answering".

sources:
  nj_bpu_reliability:
    name: NJ BPU reported electric reliability performance
    publisher: New Jersey Board of Public Utilities
    license: Open public record
    licence_class: public_record
    commercial: {ads: unclear, paid: unclear, note: Publish attributed factual figures only; no blanket third-party document licence inferred.}
    terms_url: https://www.nj.gov/nj/legal.shtml
    terms_checked: 2026-10-04
    terms_note: State Conditions of Use section F permits copying/distribution of State information, subject to specific restrictions and third-party rights. Publish attributed factual figures only, not scans, signatures or seals; public access is not a blanket third-party document licence.
    notices:
      - "Source: NJ Board of Public Utilities, August 13, 2025 order, Docket EO25070453, Tables 1–3. Actual JCP&L performance for 2022–2024. Not a complete annual-report catalogue or today's outage status."
    url: https://www.nj.gov/bpu/about/divisions/reliability/
    cadence: irregular
    adapter: hip.sources.nj_bpu:BpuReliabilityAdapter
    fallback: Retain the verified order; locate or request public annual reports for all four utilities before extending this reader. No guessed document IDs or confidential filings.
    notes: CAIDI is minutes per customer interruption, not SAIDI minutes per customer per year. Event exclusions are not specified in the imported table; do not infer an EIA method or calculate SAIDI from rounded values.
  nj_bpu_reports:
    name: Electric utilities' annual system performance reports to NJ BPU, 2024 and 2025
    publisher: New Jersey Board of Public Utilities
    license: Open public record
    licence_class: public_record
    commercial: {ads: unclear, paid: unclear, note: Publish attributed factual figures only; no blanket third-party document licence inferred.}
    terms_url: https://www.nj.gov/nj/legal.shtml
    terms_checked: 2026-10-08
    terms_note: >-
      Released by BPU's Records Custodian under OPRA (request C263585, 2026-10-08) as
      public records. State Conditions of Use section F permits copying and distribution
      of State information. Publish attributed company-wide figures only, never the
      reports, their certification letters, signatures or staff names.
    notices:
      - "Source: annual system performance reports of Atlantic City Electric, JCP&L, PSE&G and Rockland Electric to the NJ Board of Public Utilities, 2024 and 2025, released under OPRA request C263585. Company-wide actual CAIDI and SAIFI, not today's outage status or a town's own record."
    url: https://www.nj.gov/bpu/about/divisions/reliability/
    cadence: annual
    adapter: hip.sources.nj_bpu:BpuAnnualReportsAdapter
    fallback: >-
      Keep the last reports. Each spring, request the new year's four reports from BPU's
      Records Custodian under OPRA, drop them into data/manual/nj_bpu_reports/ under the
      names BPU gives them, and add each to REPORTS in hip.sources.nj_bpu once its tables
      are reviewed; an unreviewed file fails visibly.
    notes: >-
      CAIDI is minutes per customer interruption, not SAIDI. Each figure is the report's
      company-wide actual against BPU's minimum reliability levels; ACE states major
      events are excluded, and the others do not restate it beside the figure.
  doe_lead:
    name: Low Income Energy Affordability Data (LEAD), 2022 county data
    publisher: U.S. Department of Energy / National Renewable Energy Laboratory
    license: Creative Commons Attribution 4.0 International
    licence_class: attribution
    commercial: {ads: allowed, paid: allowed, note: CC BY 4.0 permits commercial reuse with attribution.}
    terms_url: https://data.openei.org/submissions/6219
    terms_checked: 2026-10-04
    terms_note: Dataset explicitly licensed CC BY 4.0. Credit DOE/NREL, link the dataset and licence, and identify derived aggregation; do not imply endorsement.
    notices:
      - "Energy context derived from DOE/NREL Low Income Energy Affordability Data (2024 release, 2018–2022 ACS calibrated to 2022 EIA). Dataset: https://doi.org/10.25984/2504170. Licensed under CC BY 4.0: https://creativecommons.org/licenses/by/4.0/. County means and ratios aggregated here."
    url: https://data.openei.org/submissions/6219
    cadence: irregular
    adapter: hip.sources.infrastructure:EnergyBurdenAdapter
    fallback: Keep the verified 2022 bulk file labelled historical; inspect the DOE download catalogue for a successor before changing the reader.
    notes: County context only, never a municipal estimate or household bill. Field-specific reporting weights are preserved. Not added to monthly cost cards or rankings.

  eia861:
    name: Annual electric utility sales and reliability (Form EIA-861)
    publisher: U.S. Energy Information Administration
    license: Public domain (U.S. Government work)
    licence_class: public_domain
    commercial: {ads: allowed, paid: allowed, note: EIA expressly permits reuse and distribution of its data.}
    terms_url: https://www.eia.gov/about/copyrights_reuse.php
    terms_checked: 2026-10-04
    terms_note: Data may be reused; acknowledge EIA and publication date. Protected third-party material and logos are excluded.
    notices:
      - "Source: U.S. Energy Information Administration, Form EIA-861, 2024 final data (publisher update: December 3, 2025). Residential bundled prices calculated here from revenue and sales; outage measures retain the utility's reporting basis."
    url: https://www.eia.gov/electricity/data/eia861/
    cadence: annual
    adapter: hip.sources.infrastructure:EiaAdapter
    fallback: Keep the dated final release; do not substitute early-release unvalidated data silently.
    notes: Residential bundled sales are distinct from delivery-only and energy-only sales. Reliability includes the reporting method and major-event-day basis. Neither is one home's bill or outage forecast.

  epa_ucmr5:
    name: UCMR 5 final occurrence data — PFAS entry-point samples
    publisher: U.S. Environmental Protection Agency
    license: Public domain (U.S. Government work)
    licence_class: public_domain
    commercial: {ads: allowed, paid: allowed, note: EPA permits distribution unless material is separately copyrighted.}
    terms_url: https://www.epa.gov/web-policies-and-procedures/epa-disclaimers
    terms_checked: 2026-10-04
    terms_note: Public agency data; no separate restriction on the offered bulk occurrence files. No EPA endorsement is implied.
    url: https://www.epa.gov/dwucmr/occurrence-data-unregulated-contaminant-monitoring-rule
    cadence: irregular
    adapter: hip.sources.infrastructure:UcmrAdapter
    fallback: Keep the final August 2026 release and its actual sample dates; link the EPA Data Finder if the ZIP is unavailable.
    notes: The 2023–2025 cycle includes 2026 follow-up samples. Below reporting limit is not zero. A single sample above a reference limit is not a regulatory violation or today's tap-water result. Coverage excludes many small systems and private wells.

  njdep_utility_areas:
    name: Electric and gas utility territory maps
    publisher: New Jersey Department of Environmental Protection
    license: NJDEP Data Distribution Agreement
    licence_class: attribution
    commercial: {ads: allowed, paid: allowed, note: "NJDEP conditions reuse on attribution and metadata, without a commercial-use limit."}
    terms_url: https://www.arcgis.com/home/item.html?id=d23845cc51454ee59affd226cff3fcd5
    terms_checked: 2026-10-04
    terms_note: >-
      Both official NJDEPBGIS items (electric d23845cc51454ee59affd226cff3fcd5;
      gas b6a9f5a46f464711ad7799b5d3f92f80) carry NJDEP's agreement. Only derived
      town/provider associations are published, with metadata links and the required notice;
      raw geometry is not redistributed. Electric boundaries originate in small-scale
      paper maps and are not suitable for exact property-level claims.
    notices:
      - This (map/publication/report) was developed using New Jersey Department of Environmental Protection Geographic Information System digital data, but this secondary product has not been verified by NJDEP and is not state-authorized or endorsed.
    url: https://mapsdep.nj.gov/arcgis/rest/services/Features/Utilities/MapServer
    homepage: https://www.arcgis.com/home/item.html?id=d23845cc51454ee59affd226cff3fcd5
    cadence: irregular
    adapter: hip.sources.infrastructure:UtilityAreasAdapter
    fallback: Keep the last map labelled approximate; consult BPU or the provider for one address.

  njdep_lead_lines:
    name: Community water purveyor service line inventory
    publisher: New Jersey Department of Environmental Protection
    license: NJDEP Data Distribution Agreement
    licence_class: attribution
    commercial: {ads: allowed, paid: allowed, note: "NJDEP conditions reuse on attribution and metadata, without a commercial-use limit."}
    terms_url: https://www.arcgis.com/home/item.html?id=54dd411b2c8449cc9efb3748143716f2
    terms_checked: 2026-10-04
    terms_note: >-
      Official NJDEPBGIS item and PLEM app both carry NJDEP's agreement. Publish derived
      summaries with the required notice and metadata link, not raw geometry or addresses.
      Submission year and category-update date are distinct from download date.
    notices:
      - This (map/publication/report) was developed using New Jersey Department of Environmental Protection Geographic Information System digital data, but this secondary product has not been verified by NJDEP and is not state-authorized or endorsed.
    url: https://services1.arcgis.com/QWdNfRs7lkPq4g4Q/arcgis/rest/services/Public_Community_Water_Purveyor_Service_Line_Inventory_for_New_Jersey/FeatureServer/37
    homepage: https://dep.nj.gov/lead/map/
    cadence: annual
    adapter: hip.sources.infrastructure:LeadLinesAdapter
    fallback: Keep the dated system inventory and direct readers to their water supplier for an individual line.
    notes: Lead, galvanized, lead connectors and unknown material are separate counts; these are not lead concentrations or a diagnosis of one property's pipe.

  nj_affordable:
    name: Affordable housing calculations and municipal status reports
    publisher: NJ Department of Community Affairs
    license: Open public record
    licence_class: public_record
    commercial: {ads: allowed, paid: allowed, note: State information may be copied and distributed.}
    terms_url: https://www.nj.gov/nj/legal.shtml
    terms_checked: 2026-10-04
    terms_note: >-
      Section F permits copying and distributing State information unless marked otherwise.
      These offered workbooks carry no separate reuse restriction. The public download
      listing is read only to discover the newest offered municipal reporting workbook.
    url: https://www.nj.gov/dca/dlps/hss/MuniStatusReporting.shtml
    cadence: annual
    adapter: hip.sources.nj_affordable:NjAffordableAdapter
    fallback: Keep the last report and its date; a missing submission is not zero.
    notes: >-
      Fourth-round 2025–2035 figures are DCA non-binding calculations published October
      2024, not final court-approved obligations. Municipal self-reports span rounds;
      completed units cannot be divided by fourth-round need. Fund balances exclude
      unspent commitments. The July 2026 workbook's fund caption and cutoff differ.

  hud_assisted:
    name: Multifamily assistance properties and Section 8 contracts
    publisher: U.S. Department of Housing and Urban Development
    license: Public domain (U.S. Government work)
    licence_class: public_domain
    commercial: {ads: allowed, paid: allowed, note: Federal agency administrative data.}
    terms_url: https://www.hud.gov/sites/documents/webpubstandards.pdf
    terms_checked: 2026-10-04
    terms_note: >-
      HUD's Web Publication Procedures and Style Guide (2025-08-27), Section 1.D,
      states its website content is generally public domain and may be used, subject
      to marked outside copyrights and the official-emblem exception. The workbook
      landing page disclaims completeness and warranty without a separate reuse
      restriction. No HUD User API
      is used. Only property/program fields land, never owner or agent personal details.
    url: https://www.hud.gov/hud-partners/multifamily-assist-section8-database
    cadence: monthly
    adapter: hip.sources.hud_assistance:HudAssistedAdapter
    fallback: Retain the last dated snapshot, never claim present vacancies or eligibility.
    notes: >-
      Contract counts are not property counts. Each contract's assisted units are kept
      separate from the whole property's units. County codes are explicit; mailing cities
      are not matched to municipalities. Contract end dates can be extended or renewed.

  hud_lihtc:
    name: Low-Income Housing Tax Credit bulk project inventory
    publisher: U.S. Department of Housing and Urban Development
    license: Public domain (U.S. Government work)
    licence_class: public_domain
    commercial: {ads: allowed, paid: allowed, note: Federal agency administrative data.}
    terms_url: https://www.hud.gov/sites/documents/webpubstandards.pdf
    terms_checked: 2026-10-04
    terms_note: >-
      HUD's Web Publication Procedures and Style Guide (2025-08-27), Section 1.D,
      states its website content is generally public domain and may be used, subject
      to marked outside copyrights and the official-emblem exception. HUD offers the
      full project database and dictionary for public download without separate reuse
      restrictions. No HUD User API is used. Only property/program fields land, never personal
      contacts. The release page is probed for coverage; the ZIP bot-check is not bypassed.
    url: https://www.huduser.gov/portal/datasets/lihtc/property.html
    cadence: annual
    adapter: hip.sources.hud_assistance:HudLihtcAdapter
    fallback: >-
      Keep the last dated inventory. Download LIHTCPUB.ZIP from the official page,
      verify the dictionary's coverage year, and place its property workbook in
      data/manual/hud_lihtc/ as LIHTCPUB_<coverage-year>.xlsx. Discovery reports newer
      releases; missing manual files fail visibly, never relabel the previous file.
    notes: >-
      Owner-downloaded April 2026 bulk release covers 1987–2024; exceptional later and
      unknown service years are labelled separately. Census BPS place-to-MCD relationships
      establish towns only when unique and valid in the current municipality spine;
      remaining properties stay at their publisher county or state. No coordinate or
      mailing-city guesses. This is not a count of currently restricted or vacant homes.
      No-longer-monitored does not establish continued or lost affordability.
      Targeting disabled residents does not establish physical accessibility.
      No expiry is inferred from a placed-in-service year. NHPD is not acquired: a signed
      data licence is required for public redistribution.
  hip_derived:
    name: Computed by the platform
    publisher: Housing Intelligence Platform
    license: Derived from cited sources
    licence_class: derived
    terms_url: https://github.com/jasonli-git/housing-intelligence/blob/main/NOTICE
    terms_note: >-
      The platform's own figures, each carrying the most restrictive licence of the metrics it is computed from (ARCHITECTURE #269).
    url: https://github.com/jasonli-git/housing-intelligence
    cadence: irregular
    adapter: none
    fallback: >-
      Not fetched: computed from the sources below, so it falls back with them.
    notes: >-
      Not fetched. Metrics the platform computes from other sources — affordability
      ratios today — are written as ordinary facts under this source so every value
      still names a release (ARCHITECTURE #9).

  census_tiger:
    name: TIGER/Line boundary files
    publisher: U.S. Census Bureau
    license: Public domain (U.S. Government work)
    licence_class: public_domain
    commercial:
      ads: allowed
      paid: allowed
      note: >-
        A U.S. Government work, with no copyright to licence (17 U.S.C. 105); its
        terms set no limit on commercial use.
    terms_url: https://www.census.gov/about/policies/open-gov/open-data.html
    terms_checked: 2026-09-30
    url: https://www2.census.gov/geo/tiger
    cadence: annual
    adapter: hip.sources.tiger:TigerAdapter
    fallback: >-
      Census TIGERweb and the cartographic boundary files carry the same geography.
      Pinned on purpose: a new vintage is moved to by hand.
    notes: >-
      The geometry behind every region. GEOIDs here are the join keys ACS, Building
      Permits, and the Zillow crosswalks use, so the largest sources need no geographic
      reconciliation. Boundaries are generalized, not survey-grade.

  zillow_zhvi:
    # Zillow's calendar, read where FRED republishes it (Zillow's pages refuse automated
    # readers, #272): every 2026 release on its month's third Thursday.
    release_calendar:
      url: https://fred.stlouisfed.org/releases/calendar?rid=503
      checked: 2026-10-02
      dates:
        - {day: 2026-10-15, covers: September 2026}
        - {day: 2026-11-19, covers: October 2026}
        - {day: 2026-12-17, covers: November 2026}
    name: Zillow Home Value Index
    publisher: Zillow Research
    license: Free for non-commercial use with attribution
    licence_class: non_commercial
    commercial:
      ads: unclear
      paid: not_allowed
      note: >-
        The research data page: "free for public use by consumers, media, analysts,
        academics and policymakers, consistent with our published Terms of Use"; the
        Terms of Use, read by the owner on 2026-09-30, allow non-personal uses with
        attribution and say nothing about commercial use. A free site carrying ads
        resembles the media use the page names, but nothing grants it. A paid tier
        sells access to the figures, which nothing covers. The licensed route, the
        Zillow API Terms of Use on Bridge (updated November 2023, read 2026-10-01),
        forbids letting end users download or keep copies (5.18, 6), derivative
        works (5.17), keeping the data on servers outside the United States (25) and
        products that compete with Zillow without its approval (5.14), at a monthly
        fee it does not publish (8), on an application it may refuse (3).
    terms_url: https://www.zillow.com/corporate/terms-of-use/
    terms_checked: 2026-09-30
    terms_note: >-
      Read by the owner by hand on 2026-09-30 (the pages refuse automated readers). The
      research data page: "free for public use by consumers, media, analysts, academics
      and policymakers, consistent with our published Terms of Use. Proper and clear
      attribution of all data to Zillow is required." The Terms of Use (updated
      2025-10-28), section 4C: aggregate-level data "may be used for non-personal uses,
      e.g., real estate market analysis", and derivative works may be displayed and
      distributed "only so long as the Zillow Companies are cited as a source on every
      page where the Aggregate Data are displayed, including 'Data Provided by Zillow
      Group'", with no logo and no implied relationship. Neither says non-commercial; the
      class stays non_commercial until Milestone 32 settles commercial use. Section 5
      forbids "automated queries … or any other automated activity with the purpose of
      obtaining information from the Services" (ARCHITECTURE #272).
    notices:
      - >-
        Data Provided by Zillow Group.
    url: https://www.zillow.com/research/data/
    cadence: monthly
    adapter: hip.sources.zillow:ZhviAdapter
    fallback: >-
      No free equivalent. The cost card already falls back to the SR1A transaction
      median (#187); FHFA's county index (reachable, retested 2026-09-23) carries price
      trends. Otherwise keep the last release, labelled historical.
    notes: >-
      Smoothed, seasonally adjusted index revised retroactively; a new release can
      change history already loaded. See Known Limitations in ARCHITECTURE.md.

  zillow_zori:
    release_calendar:
      url: https://fred.stlouisfed.org/releases/calendar?rid=503
      checked: 2026-10-02
      dates:
        - {day: 2026-10-15, covers: September 2026}
        - {day: 2026-11-19, covers: October 2026}
        - {day: 2026-12-17, covers: November 2026}
    name: Zillow Observed Rent Index
    publisher: Zillow Research
    license: Free for non-commercial use with attribution
    licence_class: non_commercial
    commercial:
      ads: unclear
      paid: not_allowed
      note: >-
        As zillow_zhvi: the same research page, Terms of Use and API terms.
    terms_url: https://www.zillow.com/corporate/terms-of-use/
    terms_checked: 2026-09-30
    terms_note: >-
      Read by the owner by hand on 2026-09-30 (the pages refuse automated readers). The
      research data page: "free for public use by consumers, media, analysts, academics
      and policymakers, consistent with our published Terms of Use. Proper and clear
      attribution of all data to Zillow is required." The Terms of Use (updated
      2025-10-28), section 4C: aggregate-level data "may be used for non-personal uses,
      e.g., real estate market analysis", and derivative works may be displayed and
      distributed "only so long as the Zillow Companies are cited as a source on every
      page where the Aggregate Data are displayed, including 'Data Provided by Zillow
      Group'", with no logo and no implied relationship. Neither says non-commercial; the
      class stays non_commercial until Milestone 32 settles commercial use. Section 5
      forbids "automated queries … or any other automated activity with the purpose of
      obtaining information from the Services" (ARCHITECTURE #272).
    notices:
      - >-
        Data Provided by Zillow Group.
    url: https://www.zillow.com/research/data/
    cadence: monthly
    adapter: hip.sources.zillow:ZoriAdapter
    fallback: >-
      No free equivalent for asking rents. ACS gross rent and HUD Fair Market Rents
      describe rent differently and are labelled as such. Otherwise keep the last
      release, labelled historical.

  census_acs:
    name: American Community Survey, 5-year estimates
    publisher: U.S. Census Bureau
    license: Public domain (U.S. Government work)
    licence_class: public_domain
    commercial:
      ads: allowed
      paid: allowed
      note: >-
        The Census Bureau Data API terms (read 2026-10-01) let a service "search,
        display, analyze" its data, require only the no-endorsement notice, and
        forbid implying endorsement of any product "not-for-profit, commercial or
        otherwise", so commercial services are contemplated. A U.S. Government work.
    terms_url: https://www.census.gov/data/developers/about/terms-of-service.html
    terms_checked: 2026-09-30
    notices:
      - >-
        This product uses the Census Bureau Data API but is not endorsed or certified by the Census Bureau.
    url: https://api.census.gov/data
    homepage: https://www.census.gov/programs-surveys/acs
    cadence: annual
    adapter: hip.sources.census_acs:AcsAdapter
    fallback: >-
      The ACS Summary File at www2.census.gov/programs-surveys/acs/summary_file carries
      the same tables without the API.
    api_key_env: CENSUS_API_KEY
    notes: >-
      Consecutive 5-year vintages overlap by four years, so year-over-year change is
      not an independent measurement.

  census_pep:
    # Vintage 2026, as of 2026-07-01; the Census Bureau names months, not days.
    release_calendar:
      url: https://www.census.gov/programs-surveys/popest/about/schedule.html
      checked: 2026-10-02
      dates:
        - {day: 2027-03-01, precision: month, covers: counties}
        - {day: 2027-05-01, precision: month, covers: cities and towns}
    name: Population Estimates Program, Vintage 2025
    publisher: U.S. Census Bureau
    license: Public domain (U.S. Government work)
    licence_class: public_domain
    commercial:
      ads: allowed
      paid: allowed
      note: >-
        The Census Bureau Data API terms (read 2026-10-01) let a service "search,
        display, analyze" its data, require only the no-endorsement notice, and
        forbid implying endorsement of any product "not-for-profit, commercial or
        otherwise", so commercial services are contemplated. A U.S. Government work.
    terms_url: https://www.census.gov/data/developers/about/terms-of-service.html
    terms_checked: 2026-09-30
    notices:
      - >-
        This product uses the Census Bureau Data API but is not endorsed or certified by the Census Bureau.
    url: https://www2.census.gov/programs-surveys/popest/datasets
    homepage: https://www.census.gov/programs-surveys/popest.html
    cadence: annual
    adapter: hip.sources.census_pep:PepAdapter
    fallback: >-
      FRED republishes county resident population (e.g. NJATLA2POP). Municipal estimates
