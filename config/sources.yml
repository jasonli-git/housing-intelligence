  fred:
    # Freddie Mac's weekly survey, published Thursdays (moved around holidays).
    release_calendar:
      url: https://www.freddiemac.com/pmms
      checked: 2026-10-02
      weekly: thursday
    name: Federal Reserve Economic Data
    publisher: Federal Reserve Bank of St. Louis
    license: Free with attribution; series-level terms vary by originator
    licence_class: display_only
    commercial:
      ads: unclear
      paid: unclear
      note: >-
        FRED's API terms (read 2026-10-01) allow commercial applications, but leave
        a third party's series to its owner, whose permission is needed "for
        anything other than your own personal use"; Freddie Mac's PMMS page allows
        its rate to be used "with proper attribution" without saying whether
        commercially. The API terms also forbid its use "in connection with"
        professional services regulated by state licensing regimes, which a site
        advertising lenders or agents would be.
    terms_url: https://fred.stlouisfed.org/legal/
    terms_checked: 2026-09-30
    terms_note: >-
      FRED lists MORTGAGE30US as Freddie Mac's copyrighted series, "Citation required", and asks for the owner's permission for anything beyond personal use. Freddie Mac's PMMS page allows use with attribution; its general terms forbid redistributing data without a licence. FRED's notes for the series, read by the owner on 2026-09-30: "Copyright, 2016, Freddie Mac. Reprinted with permission." — permission granted to FRED, which does not pass to sites taking it from FRED — and a suggested citation, now a notice. Freddie Mac's PMMS page and Terms and Conditions (last updated 2026-09-11), read by the owner the same day: the terms forbid displaying site content "without our prior written consent, unless otherwise noted", and the PMMS page notes "Information from this document may be used with proper attribution", so display with credit is allowed; "Data" (datasets and "similar materials") may not be redistributed without a licence, and "alteration of this document or its content" is prohibited, so the weekly rate and the monthly average computed from it stay out of downloadable files; scripts may not collect content from Freddie Mac's websites. So it is shown, credited to Freddie Mac via FRED, and left out of the CSV downloads; its series stays in the site's JSON, which the pages are built from.
    notices:
      - >-
        This product uses the FRED® API but is not endorsed or certified by the Federal Reserve Bank of St. Louis. FRED® API Terms of Use: https://fred.stlouisfed.org/docs/api/terms_of_use.html
      - >-
        30-year mortgage rate: Freddie Mac, 30-Year Fixed Rate Mortgage Average in the
        United States [MORTGAGE30US], retrieved from FRED, Federal Reserve Bank of St.
        Louis; https://fred.stlouisfed.org/series/MORTGAGE30US.
    url: https://api.stlouisfed.org/fred
    homepage: https://fred.stlouisfed.org/
    cadence: monthly
    adapter: hip.sources.fred:FredAdapter
    fallback: >-
      Freddie Mac publishes the PMMS history directly (freddiemac.com/pmms,
      historicalweeklydata.xlsx) — downloaded by hand only: Freddie Mac's terms forbid
      scripts collecting content from its websites without written permission (#269).
    api_key_env: FRED_API_KEY
    notes: No anonymous access; a key is required for every request.

