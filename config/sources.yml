    notes: >-
      Headline population as of July 1, carried forward from the 2020 census by births,
      deaths and migration. A different program from ACS, whose 5-year estimates average
      five years of sample. ACS remains the denominator of every ratio, so no ratio
      mixes the two.

  census_permits:
    name: Building Permits Survey
    publisher: U.S. Census Bureau
    license: Public domain (U.S. Government work)
    licence_class: public_domain
    commercial:
      ads: allowed
      paid: allowed
      note: >-
        A U.S. Government work, with no copyright to licence (17 U.S.C. 105); its
