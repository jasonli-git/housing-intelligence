# Metric definitions. Each key becomes a row in the `metrics` warehouse table and is
# the `metric_id` referenced by every fact (ARCHITECTURE #8). Two sources supplying the
# same concept write to the same metric_id, which makes their disagreement visible
# instead of turning it into two columns.
#
# direction: how to read a rise — used by rankings and by packet caveats.

metrics:
  zhvi_sfr:
    label: Home value index, single-family
    unit: usd
    frequency: monthly
    direction: neutral
    description: Zillow smoothed, seasonally adjusted typical home value.
    source_id: zillow_zhvi

  zori_all:
    label: Observed rent index, all homes
    unit: usd_month
    frequency: monthly
    direction: neutral
    description: Zillow repeat-rent index of asking rents.
    source_id: zillow_zori

  acs_median_hh_income:
    label: Median household income
    unit: usd
    frequency: annual
    direction: higher_is_better
    description: ACS 5-year estimate, table B19013.
    source_id: census_acs

  acs_median_gross_rent:
    label: Median gross rent
    unit: usd_month
    frequency: annual
    direction: neutral
    description: ACS 5-year estimate, table B25064. Contract rent plus utilities.
    source_id: census_acs

  acs_population:
    label: Total population
    unit: count
    frequency: annual
    direction: neutral
    description: ACS 5-year estimate, table B01003.
    source_id: census_acs

  acs_median_home_value:
    label: Median owner-occupied home value
    unit: usd
    frequency: annual
    direction: neutral
    description: ACS 5-year estimate, table B25077. Self-reported by owners.
    source_id: census_acs

  acs_renter_cost_burden:
    label: Renters paying over 30% of income on housing
    unit: ratio
    frequency: annual
    direction: lower_is_better
    description: ACS 5-year estimate derived from table B25070.
    source_id: census_acs

  permits_total_units:
    label: Residential units permitted
    unit: count
    frequency: monthly
    direction: higher_is_better
    description: New privately-owned housing units authorized, all structure sizes.
    source_id: census_permits

  fhfa_hpi:
    label: House price index
    unit: index
    frequency: quarterly
    direction: neutral
    description: Repeat-sales index of conforming mortgage transactions.
    source_id: fhfa_hpi

  mortgage_rate_30y:
    label: 30-year fixed mortgage rate
    unit: percent
    frequency: monthly
    direction: lower_is_better
    description: FRED series MORTGAGE30US, monthly average. National, not regional.
    source_id: fred

  unemployment_rate:
    label: Unemployment rate
    unit: percent
    frequency: monthly
    direction: lower_is_better
    description: BLS Local Area Unemployment Statistics, not seasonally adjusted.
    source_id: bls

  net_migration_returns:
    label: Net migration, tax returns
    unit: count
    frequency: annual
    direction: neutral
    description: IRS SOI inflow minus outflow returns, a proxy for household moves.
    source_id: irs_migration

  price_to_income:
    label: Home value to household income
    unit: ratio
    frequency: annual
    direction: lower_is_better
    description: >-
      Typical home value divided by median household income, both for the same year.
      Zillow is monthly and ACS is annual, so the Zillow side is the mean of that
      year's months. A ratio near 3 was long considered affordable; above 5 is strained.
    source_id: hip_derived

  rent_to_income:
    label: Annual rent to household income
    unit: ratio
    frequency: annual
    direction: lower_is_better
    description: >-
      Twelve months of observed rent divided by median household income. The 30%
      threshold that defines cost burden corresponds to a ratio of 0.30.
    source_id: hip_derived

  hud_area_median_income:
    label: Area median income (HUD)
    unit: usd
    frequency: annual
    direction: higher_is_better
    description: >-
      HUD's area median family income, the denominator behind every AMI band. Published
      per county and revised annually.
    source_id: hud

  hud_income_limit_80:
    label: Low-income limit, 80% AMI, 4-person household
    unit: usd
    frequency: annual
    direction: neutral
    description: >-
      HUD's 80% of area median income threshold for a four-person household, the
      conventional reference figure in housing policy.
    source_id: hud

  # MOD-IV assessment aggregates. Every one is a municipality-level summary of the
  # 3.48M-parcel file, computed in DuckDB and promoted as a single value per place
  # (ARCHITECTURE #16). They describe the housing *stock* — how much of it there is,
  # how old, on what lots — which nothing else in the warehouse measures.
  #
  # All six are snapshots: MOD-IV publishes one current composite, so these have a
  # single period and therefore no change or CAGR. They are ranked by value instead
  # (ARCHITECTURE #52).
  modiv_median_assessed_value:
    label: Median assessed value, residential parcels
    unit: usd
    frequency: annual
    direction: neutral
    description: >-
      Median MOD-IV net assessed value across class-2 (1-4 family residential) parcels.
      An assessment is not a market value: ratios drift between revaluations and vary by
      municipality, so this tracks the tax roll rather than what houses sell for.
    source_id: nj_modiv

  modiv_residential_parcels:
    label: Residential parcels
    unit: count
    frequency: annual
    direction: neutral
    description: >-
      Count of class-2 parcels. The size of the taxable residential stock, which is a
      different quantity from households or housing units — one parcel can carry a
      four-family building.
    source_id: nj_modiv

  modiv_median_year_built:
    label: Median year built, residential parcels
    unit: year
    frequency: annual
    direction: neutral
    description: >-
      Median year of construction across class-2 parcels reporting one. The age of the
      housing stock, which no other source in the warehouse measures.
    source_id: nj_modiv

  modiv_median_lot_acres:
    label: Median residential lot size
    unit: acres
    frequency: annual
    direction: neutral
    description: >-
      Median calculated acreage of class-2 parcels. A density proxy: half-acre minimums
      and quarter-acre grids are visible here where zoning text is not.
    source_id: nj_modiv

  modiv_vacant_land_share:
    label: Vacant land share of parcels
    unit: ratio
    frequency: annual
    direction: neutral
    description: >-
      Class-1 (vacant land) parcels as a share of all parcels. Read as development
      capacity with care — vacant also covers unbuildable wetland and preserved land.
    source_id: nj_modiv

  modiv_multifamily_share:
    label: Apartment share of residential parcels
    unit: ratio
    frequency: annual
    direction: neutral
    description: >-
      Class-4C (apartment) parcels as a share of class-2 plus class-4C. Measures parcels,
      not units, so a single 200-unit building counts once.
    source_id: nj_modiv

  price_to_ami:
    label: Home value to area median income
    unit: ratio
    frequency: annual
    direction: lower_is_better
    description: >-
      Typical home value divided by HUD's area median income. Parallel to
      price_to_income but against a published policy benchmark rather than an ACS
      survey estimate.
    source_id: hip_derived
