# Metric definitions. Each key becomes a row in the `metrics` warehouse table and is
# the `metric_id` referenced by every fact (ARCHITECTURE #8). Two sources supplying the
# same concept write to the same metric_id, which makes their disagreement visible
# instead of turning it into two columns.
#
# direction: how to read a rise — used by rankings and by packet caveats.
# record_type: what kind of figure it is (SPEC principle 11), shown beside it in every
#   table — see `RecordType` in hip.config. A median the platform takes of administrative
#   records (MOD-IV, SR1A) is `administrative`: the records are the observation, and the
#   median is the table's summary of them, not a model or a ratio.
# inputs: for the platform's own calculated metrics, what each is computed from; its
#   licence is the most restrictive of theirs (ARCHITECTURE #269).
# originator: who owns a series its source redistributes, credited beside the source.

metrics:
  nj_ah_present_need:
    label: DCA fourth-round present need, non-binding
    unit: count
    frequency: irregular
    direction: neutral
    description: DCA October 2024 calculation for the 2025–2035 round, not a final legal obligation.
    source_id: nj_affordable
    record_type: modelled
    ranked: false

  nj_ah_prospective_need:
    label: DCA fourth-round prospective need, capped and non-binding
    unit: count
    frequency: irregular
    direction: neutral
    description: DCA October 2024 calculation with the published 1,000/20% cap. Not final obligations.
    source_id: nj_affordable
    record_type: modelled
    ranked: false

  nj_ah_completed_units:
    label: Affordable units in projects reported completed
    unit: count
    frequency: annual
    direction: neutral
    description: >-
      DCA municipal self-reports with a granted certificate of occupancy. Across rounds,
      including rehabilitation; missing units and unknown completion statuses are omitted.
      A partial inventory, not fourth-round compliance or net new homes.
    source_id: nj_affordable
    record_type: administrative
    ranked: false

  nj_ah_trust_balance:
    label: Reported affordable housing trust fund balance
    unit: usd
    frequency: annual
    direction: neutral
    description: >-
      DCA municipal self-reports, including signed balances as published. Missing
      submissions are omitted; sums are partial. Commitments not yet spent are not deducted.
    source_id: nj_affordable
    record_type: administrative
    ranked: false
  zhvi_sfr:
    label: Home value index, single-family
    unit: usd
    frequency: monthly
    direction: neutral
    description: Zillow smoothed, seasonally adjusted typical home value.
    source_id: zillow_zhvi
    record_type: modelled

  zori_all:
    label: Observed rent index, all homes
    unit: usd_month
    frequency: monthly
    direction: neutral
    description: Zillow repeat-rent index of asking rents.
    source_id: zillow_zori
    record_type: modelled

  acs_median_hh_income:
    label: Median household income
    unit: usd
    frequency: annual
    direction: higher_is_better
    description: ACS 5-year estimate, table B19013.
    source_id: census_acs
    record_type: survey

  acs_median_gross_rent:
    label: Median gross rent
    unit: usd_month
    frequency: annual
    direction: neutral
    description: ACS 5-year estimate, table B25064. Contract rent plus utilities.
    source_id: census_acs
    record_type: survey

  acs_population:
    label: Total population
    unit: count
    frequency: annual
    direction: neutral
    description: ACS 5-year estimate, table B01003.
    source_id: census_acs
    record_type: survey

  pep_population:
    label: Population estimate
    unit: count
    frequency: annual
    direction: neutral
    description: >-
      Census Population Estimates Program, as of July 1. A point-in-time estimate, not a
      survey average — acs_population is the 5-year ACS figure and remains the
      denominator of every computed ratio.
    source_id: census_pep
    record_type: modelled

  acs_median_home_value:
    label: Median owner-occupied home value
    unit: usd
    frequency: annual
    direction: neutral
    description: ACS 5-year estimate, table B25077. Self-reported by owners.
    source_id: census_acs
    record_type: survey

  acs_renter_cost_burden:
    label: Renters paying over 30% of income on housing
    unit: ratio
    frequency: annual
    direction: lower_is_better
    description: ACS 5-year estimate derived from table B25070.
    source_id: census_acs
    record_type: survey

  permits_total_units:
    label: Residential units permitted
    unit: count
    frequency: monthly
    direction: higher_is_better
    description: New privately-owned housing units authorized, all structure sizes.
    source_id: census_permits
    record_type: administrative

  fhfa_hpi:
    label: House price index
    unit: index
    frequency: quarterly
    direction: neutral
    description: Repeat-sales index of conforming mortgage transactions.
    source_id: fhfa_hpi
    record_type: modelled

  mortgage_rate_30y:
    label: 30-year fixed mortgage rate
    unit: percent
    frequency: monthly
    direction: lower_is_better
    description: >-
      FRED series MORTGAGE30US, monthly average. National, not regional. A month still
      in progress is dated through the last week observed rather than its last day.
    source_id: fred
    record_type: benchmark
    originator: Freddie Mac

  mortgage_rate_30y_weekly:
    label: 30-year fixed mortgage rate, weekly benchmark
    unit: percent
    frequency: weekly
    direction: lower_is_better
    description: >-
      Freddie Mac's weekly survey benchmark (FRED MORTGAGE30US, not averaged). National,
      not regional. Prices today's cost card; the monthly average carries the history.
    source_id: fred
    record_type: benchmark
    originator: Freddie Mac

  unemployment_rate:
    label: Unemployment rate
    unit: percent
    frequency: monthly
    direction: lower_is_better
    description: BLS Local Area Unemployment Statistics, not seasonally adjusted.
    source_id: bls
    record_type: modelled

  net_migration_returns:
    label: Net migration, tax returns
    unit: count
    frequency: annual
    direction: neutral
    description: IRS SOI inflow minus outflow returns, a proxy for household moves.
    source_id: irs_migration
    record_type: administrative

  price_to_income:
    label: Home value to household income
    unit: ratio
    frequency: annual
    direction: lower_is_better
    description: >-
      Typical home value divided by median household income, both for the same year.
      Zillow is monthly and ACS is annual, so the Zillow side is the mean of that
      year's months. A ratio near 3 was long considered affordable; above 5 is strained.
    source_id: hip_derived
    record_type: calculated
    inputs: [zhvi_sfr, acs_median_hh_income]

  rent_to_income:
    label: Annual rent to household income
    unit: ratio
    frequency: annual
    direction: lower_is_better
    description: >-
      Twelve months of observed rent divided by median household income. The 30%
      threshold that defines cost burden corresponds to a ratio of 0.30.
    source_id: hip_derived
    record_type: calculated
    inputs: [zori_all, acs_median_hh_income]

  hud_area_median_income:
    label: Area median income (HUD)
    unit: usd
    frequency: annual
    direction: higher_is_better
    description: >-
      HUD's area median family income, the denominator behind every AMI band. Published
      per county and revised annually.
    source_id: hud
    record_type: determination

  hud_income_limit_80:
    label: Low-income limit, 80% AMI, 4-person household
    unit: usd
    frequency: annual
    direction: neutral
    description: >-
      HUD's 80% of area median income threshold for a four-person household, the
      conventional reference figure in housing policy.
    source_id: hud
    record_type: determination

  # MOD-IV assessment aggregates. Every one is a summary of the 3.48M-parcel file,
  # computed in DuckDB and promoted as a single value per place (ARCHITECTURE #16): per
  # municipality, and since Milestone 17 per county over all of its parcels — every
  # metric but the assessed value, which municipalities set at their own ratios. They
  # describe the housing *stock* — how much of it there is, how old, on what lots, what
  # it is taxed — which nothing else in the warehouse measures.
  #
  # All seven are snapshots: MOD-IV publishes one current composite, so these have a
  # single period and therefore no change or CAGR. They are ranked by value instead
  # (ARCHITECTURE #52).
  modiv_median_assessed_value:
    label: Median assessed value, residential parcels
    unit: usd
    frequency: annual
    direction: neutral
    description: >-
      Median MOD-IV net assessed value across class-2 (1-4 family residential) parcels.
      An assessment is not a market value: ratios drift between revaluations and vary by
      municipality, so this tracks the tax roll rather than what houses sell for.
    source_id: nj_modiv
    record_type: administrative

  modiv_residential_parcels:
    label: Residential parcels
    unit: count
    frequency: annual
    direction: neutral
    description: >-
      Count of class-2 parcels. The size of the taxable residential stock, which is a
      different quantity from households or housing units — one parcel can carry a
      four-family building.
    source_id: nj_modiv
    record_type: administrative

  modiv_median_year_built:
    label: Median year built, residential parcels
    unit: year
    frequency: annual
    direction: neutral
    description: >-
      Median year of construction across class-2 parcels reporting one. The age of the
      housing stock, which no other source in the warehouse measures.
    source_id: nj_modiv
    record_type: administrative

  modiv_median_lot_acres:
    label: Median residential lot size
    unit: acres
    frequency: annual
    direction: neutral
    description: >-
      Median calculated acreage of class-2 parcels. A density proxy: half-acre minimums
      and quarter-acre grids are visible here where zoning text is not.
    source_id: nj_modiv
    record_type: administrative

  modiv_vacant_land_share:
    label: Vacant land share of parcels
    unit: ratio
    frequency: annual
    direction: neutral
    description: >-
      Class-1 (vacant land) parcels as a share of all parcels. Read as development
      capacity with care — vacant also covers unbuildable wetland and preserved land.
    source_id: nj_modiv
    record_type: administrative

  modiv_multifamily_share:
    label: Apartment share of residential parcels
    unit: ratio
    frequency: annual
    direction: neutral
    description: >-
      Class-4C (apartment) parcels as a share of class-2 plus class-4C. Measures parcels,
      not units, so a single 200-unit building counts once.
    source_id: nj_modiv
    record_type: administrative

  # Milestone 17: the yearly bill behind the cost to own. Real dollars, unlike an
  # assessment, so a county figure taken over all of its parcels means something.
  modiv_median_tax_bill:
    label: Annual property tax bill, typical home
    unit: usd
    frequency: annual
    direction: neutral
    description: >-
      Median of last year's total property tax (MOD-IV LAST_YR_TX) across class-2 (1-4
      family residential) parcels carrying a bill. The bill as levied, before relief paid
      to individual households. Per municipality, and per county over all of its parcels
      rather than as a median of municipal medians.
    source_id: nj_modiv
    record_type: administrative

  # Milestone 25: what buyers actually paid, as opposed to what a model or an owner
  # says a home is worth. The three coexist on purpose (SPEC principle 11).
  sr1a_median_sale_price:
    label: Typical sale price, recent transactions
    unit: usd
    frequency: annual
    direction: neutral
    description: >-
      Median verified price of usable class-2 (1-4 family residential) sales over the
      three years ending in the period shown, from NJ's SR1A sales file. Usable is the
      Division of Taxation's own determination -- inheritances, transfers between
      relatives, sheriff's sales and 30 other non-usable categories are excluded by the
      state, not by a threshold chosen here. An observed transaction price, unlike
      zhvi_all_homes (modelled) and acs_median_home_value (self-reported). Three years
      because a single year leaves 103 of 564 municipalities below 20 sales. Suppressed
      below 20 sales in the window. Counties and the state are taken over their deeds,
      not as a median of municipal medians.
    source_id: nj_sr1a
    record_type: administrative

  # Milestone 25: the rate ARCHITECTURE #141 wanted and could not compute.
  nj_effective_tax_rate:
    label: Effective property tax rate
    unit: rate_per_100
    frequency: annual
    direction: lower_is_better
    description: >-
      Tax per $100 of *market* value, as published by the NJ Division of Taxation for
      each municipality. Comparable across municipalities, which the general rate is
      not, because it restates the levy against equalized rather than assessed value.
      Ingested, never derived, for a municipality; a county's and the state's are its
      towns' rates weighted by equalized valuation from the Table of Equalized
      Valuations (Milestone 37) -- see nj_director_ratio.
    source_id: nj_tax_rates
    record_type: determination

  nj_general_tax_rate:
    label: General property tax rate
    unit: rate_per_100
    frequency: annual
    direction: neutral
    description: >-
      Tax per $100 of *assessed* value, as published. Not comparable between
      municipalities: each assesses at its own ratio, so a high general rate can mean a
      low assessment rather than a heavy levy. Winfield Township's 2025 rate of 23.411
      against a state median of 2.974 is the clearest case. Use nj_effective_tax_rate to
      compare places; this is here because it is the rate that appears on a tax bill.
    source_id: nj_tax_rates
    record_type: determination

  nj_director_ratio:
    label: Director's Ratio (assessment to market value)
    unit: percent
    frequency: annual
    direction: neutral
    description: >-
      Assessed value as a percentage of market value, from the Table of Equalized
      Valuations. Landed as the check on the published effective rate rather than as its
      input: pairing a general rate with the prior year's ratio reproduces the published
      effective rate to within 0.5% for only 53% of municipality-years. Also the measure
      of how stale a municipality's assessments are -- a ratio far from 100 means a
      revaluation is overdue.
    source_id: nj_tax_rates
    record_type: determination

  price_to_ami:
    label: Home value to area median income
    unit: ratio
    frequency: annual
    direction: lower_is_better
    description: >-
      Typical home value divided by HUD's area median income. Parallel to
      price_to_income but against a published policy benchmark rather than an ACS
      survey estimate.
    source_id: hip_derived
    record_type: calculated
    inputs: [zhvi_sfr, hud_area_median_income]

  # Milestone 21 — New Jersey depth.
  acs_homeownership_rate:
    label: Homeownership rate
    unit: ratio
    frequency: annual
    direction: neutral
    description: >-
      Owner-occupied units as a share of occupied units, ACS 5-year table B25003. The
      warehouse held no ownership measure before Milestone 21.
    source_id: census_acs
    record_type: survey

  acs_vacancy_rate:
    label: Vacancy rate
    unit: ratio
    frequency: annual
    direction: neutral
    description: >-
      Vacant units as a share of all housing units, ACS 5-year table B25002. Counts
      seasonal and for-sale units as vacant, so shore towns read high by definition.
    source_id: census_acs
    record_type: survey

  # Milestone 39: the denominator for homes added per 1,000 homes.
  acs_housing_units:
    label: Homes, all housing units
    unit: count
    frequency: annual
    direction: neutral
    description: >-
      All housing units, occupied or vacant, ACS 5-year table B25002. The size of the
      housing stock new construction is measured against.
    source_id: census_acs
    record_type: survey
    ranked: false

  fhfa_hpi_all_transactions:
    label: House price index, all transactions
    unit: index
    frequency: quarterly
    direction: neutral
    description: >-
      FHFA's repeat-sales index including refinance appraisals, not seasonally adjusted,
      from 1975 — sixteen years longer than the purchase-only index. The series FRED
      republishes as NJSTHPI.
    source_id: fhfa_hpi
    record_type: modelled

  hud_fmr_2br:
    label: Fair Market Rent, two-bedroom
    unit: usd_month
    frequency: annual
    direction: neutral
    description: >-
      HUD's gross rent standard for a two-bedroom unit in the county's FMR area, set per
      federal fiscal year from 1 October. Counties sharing an FMR area share a figure.
    source_id: hud_fmr
    record_type: determination

  fmr_to_income:
    label: Two-bedroom Fair Market Rent to household income
    unit: ratio
    frequency: annual
    direction: lower_is_better
    description: >-
      Twelve months of the two-bedroom Fair Market Rent divided by median household
      income: rent burden against HUD's published standard rather than an observed
      index, so it covers every county where rent_to_income covers 19. County level
      only — HUD sets FMRs per area and does not sanction allocating one down.
    source_id: hip_derived
    record_type: calculated
    inputs: [hud_fmr_2br, acs_median_hh_income]

  chas_renter_cost_burden:
    label: Renters paying over 30% of income, HUD CHAS
    unit: ratio
    frequency: annual
    direction: lower_is_better
    description: >-
      Renter households paying more than 30% of income for housing, as HUD tabulates
      it from ACS microdata. The published counterpart of acs_renter_cost_burden, which
      the platform derives from B25070.
    source_id: hud_chas
    record_type: survey

  chas_renter_severe_burden:
    label: Renters paying over 50% of income, HUD CHAS
    unit: ratio
    frequency: annual
    direction: lower_is_better
    description: >-
      Renter households paying more than half of income for housing — HUD's severe cost
      burden, which no ACS table the warehouse reads can give.
    source_id: hud_chas
    record_type: survey

  chas_owner_cost_burden:
    label: Owners paying over 30% of income, HUD CHAS
    unit: ratio
    frequency: annual
    direction: lower_is_better
    description: >-
      Owner households paying more than 30% of income for housing. The warehouse's
      first owner-side burden measure.
    source_id: hud_chas
    record_type: survey

  # The costs of a home beyond its mortgage and tax (Milestone 33). The Census publishes
  # each only in brackets; the figure is the median interpolated within them, among the
  # homes charged for it, with no published margin (stg_census_acs_costs).
  acs_median_home_insurance:
    label: Homeowners insurance a year, typical home with a mortgage
    unit: usd
    frequency: annual
    direction: neutral
    description: >-
      What owners with a mortgage report paying a year for fire, hazard and flood
      insurance, ACS 5-year table B25141. The median is interpolated here from the
      Census's brackets, among owners with a mortgage, and carries no margin. It is what
      owners already insured pay, which can be less than a new policy costs.
    source_id: census_acs
    record_type: survey
    ranked: false

  acs_median_electricity:
    label: Electricity a month, typical home billed for it
    unit: usd_month
    frequency: annual
    direction: neutral
    description: >-
      Monthly electricity cost among homes charged for it, owners and renters alike, ACS
      5-year table B25132. The median is interpolated here from the Census's brackets
      and carries no margin.
    source_id: census_acs
    record_type: survey
    ranked: false

  acs_median_gas:
    label: Gas a month, typical home billed for it
    unit: usd_month
    frequency: annual
    direction: neutral
    description: >-
      Monthly gas cost among homes charged for it, owners and renters alike, ACS 5-year
      table B25133. The median is interpolated here from the Census's brackets and
      carries no margin.
    source_id: census_acs
    record_type: survey
    ranked: false

  acs_median_water_sewer:
    label: Water and sewer a year, typical home billed for it
    unit: usd
    frequency: annual
    direction: neutral
    description: >-
      Yearly water and sewer cost among homes charged for it, ACS 5-year table B25134. The
      median is interpolated here from the Census's brackets and carries no margin.
    source_id: census_acs
    record_type: survey
    ranked: false

  acs_median_other_fuel:
    label: Heating oil and other fuels a year, typical home billed for them
    unit: usd
    frequency: annual
    direction: neutral
    description: >-
      Yearly cost of oil, coal, kerosene, wood and other fuels among homes charged for
      them, ACS 5-year table B25135. The median is interpolated here from the Census's
      three brackets and carries no margin; where it falls in the top one, $750 or more,
      no figure is given.
    source_id: census_acs
    record_type: survey
    ranked: false

  acs_renters_paying_utilities:
    label: Renters paying utilities on top of rent
    unit: ratio
    frequency: annual
    direction: neutral
    description: >-
      Renter households that pay for at least one utility on top of their rent, ACS
      5-year table B25069. It says how often a quoted rent leaves the bills to the
      tenant.
    source_id: census_acs
    record_type: survey
    ranked: false

  # Milestone 34: the ACS in depth, at county, municipality and ZCTA. Every figure
  # carries its margin of error. Figures that are one band of a distribution — the
  # building types, ages, sizes and fuels — are shown as levels and never ranked or
  # changed (`ranked: false`): a page sets the bands side by side, and a ranking by
  # one band reads as a standing nobody asked for (ARCHITECTURE #283).

  acs_median_rent_studio:
    label: Median gross rent, studio
    unit: usd_month
    frequency: annual
    direction: neutral
    description: >-
      Median gross rent of studio apartments, rent plus utilities, ACS 5-year table
      B25031.
    source_id: census_acs
    record_type: survey

  acs_median_rent_1br:
    label: Median gross rent, one bedroom
    unit: usd_month
    frequency: annual
    direction: neutral
    description: >-
      Median gross rent of one-bedroom homes, rent plus utilities, ACS 5-year table
      B25031.
    source_id: census_acs
    record_type: survey

  acs_median_rent_2br:
    label: Median gross rent, two bedrooms
    unit: usd_month
    frequency: annual
    direction: neutral
    description: >-
      Median gross rent of two-bedroom homes, rent plus utilities, ACS 5-year table
      B25031.
    source_id: census_acs
    record_type: survey

  acs_median_rent_3br:
    label: Median gross rent, three bedrooms
    unit: usd_month
    frequency: annual
    direction: neutral
    description: >-
      Median gross rent of three-bedroom homes, rent plus utilities, ACS 5-year table
      B25031.
    source_id: census_acs
    record_type: survey

  acs_median_rent_4br:
    label: Median gross rent, four or more bedrooms
    unit: usd_month
    frequency: annual
    direction: neutral
    description: >-
      Median gross rent of homes with four bedrooms, rent plus utilities, ACS 5-year
      table B25031. Homes with five or more are left out.
    source_id: census_acs
    record_type: survey

  acs_rent_lower_quartile:
    label: Rent paid to the landlord, lower quarter
    unit: usd_month
    frequency: annual
    direction: neutral
    description: >-
      Lower quartile of contract rent, ACS 5-year table B25057: a quarter of renters pay
      less. Contract rent leaves out the utilities gross rent includes; the Census
      publishes quartiles only for contract rent.
    source_id: census_acs
    record_type: survey

  acs_rent_upper_quartile:
    label: Rent paid to the landlord, upper quarter
    unit: usd_month
    frequency: annual
    direction: neutral
    description: >-
      Upper quartile of contract rent, ACS 5-year table B25059: a quarter of renters pay
      more. Excludes utilities.
    source_id: census_acs
    record_type: survey

  acs_owner_costs_mortgage:
    label: Owner costs a month, with a mortgage
    unit: usd_month
    frequency: annual
    direction: neutral
    description: >-
      Median selected monthly owner costs for homes with a mortgage — mortgage, tax,
      insurance, utilities and fees — ACS 5-year table B25088.
    source_id: census_acs
    record_type: survey

  acs_owner_costs_no_mortgage:
    label: Owner costs a month, without a mortgage
    unit: usd_month
    frequency: annual
    direction: neutral
    description: >-
      Median selected monthly owner costs for homes without a mortgage, ACS 5-year table
      B25088: tax, insurance, utilities and fees.
    source_id: census_acs
    record_type: survey

  acs_renter_severe_burden:
    label: Renters paying half their income or more
    unit: ratio
    frequency: annual
    direction: lower_is_better
    description: >-
      Renters paying 50% or more of income on gross rent, over renters whose burden
      could be computed, ACS 5-year table B25070.
    source_id: census_acs
    record_type: survey

  acs_owner_severe_burden:
    label: Owners paying half their income or more
    unit: ratio
    frequency: annual
    direction: lower_is_better
    description: >-
      Owners paying 50% or more of income on owner costs, with or without a mortgage,
      over owners whose burden could be computed, ACS 5-year table B25091.
    source_id: census_acs
    record_type: survey

  acs_share_detached:
    label: Single-family detached homes
    unit: ratio
    frequency: annual
    direction: neutral
    description: >-
      Single-family detached homes as a share of all housing units, ACS 5-year table
      B25024.
    source_id: census_acs
    record_type: survey

  acs_share_attached:
    label: Townhouses and other attached homes
    unit: ratio
    frequency: annual
    direction: neutral
    description: >-
      Single-family attached homes as a share of all housing units, ACS 5-year table
      B25024.
    source_id: census_acs
    record_type: survey
    ranked: false

  acs_share_2_4_units:
    label: Homes in buildings of two to four
    unit: ratio
    frequency: annual
    direction: neutral
    description: >-
      Units in buildings of two to four units as a share of all housing units, ACS
      5-year table B25024.
    source_id: census_acs
    record_type: survey
    ranked: false

  acs_share_5_19_units:
    label: Homes in buildings of five to 19
    unit: ratio
    frequency: annual
    direction: neutral
    description: >-
      Units in buildings of five to 19 units as a share of all housing units, ACS 5-year
      table B25024.
    source_id: census_acs
    record_type: survey
    ranked: false

  acs_share_20plus_units:
