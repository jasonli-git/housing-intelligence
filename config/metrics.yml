  # Milestone 36: how homes change hands, and when a town last revalued. Shown as
  # levels; only price per square foot is ranked (ARCHITECTURE #288).

  sr1a_sales_count:
    label: Usable home sales, three years
    unit: count
    frequency: annual
    direction: neutral
    description: >-
      Usable one- to four-family sales recorded in the three years shown, from the
      state's SR1A file: the sample every sales figure here rests on.
    source_id: nj_sr1a
    record_type: administrative
    ranked: false

  sr1a_price_lower_quartile:
    label: Sale price, lower quarter
    unit: usd
    frequency: annual
    direction: neutral
    description: >-
      The price a quarter of usable one- to four-family sales fell below, over three
      years, from the state's SR1A file.
    source_id: nj_sr1a
    record_type: administrative
    ranked: false

  sr1a_price_upper_quartile:
    label: Sale price, upper quarter
    unit: usd
    frequency: annual
    direction: neutral
    description: >-
      The price a quarter of usable one- to four-family sales rose above, over three
      years, from the state's SR1A file.
    source_id: nj_sr1a
    record_type: administrative
    ranked: false

  sr1a_median_sale_price_12m:
    label: Median sale price, last twelve months
    unit: usd
    frequency: annual
    direction: neutral
    description: >-
      The median of usable one- to four-family sales over the twelve months to the
      newest deed on file, from the state's SR1A file. Published only where a place had
      50 or more such sales.
    source_id: nj_sr1a
    record_type: administrative
    ranked: false

  sr1a_median_year_built_sold:
    label: Median year built, homes sold
    unit: year
    frequency: annual
    direction: neutral
    description: >-
      The median year built of the one- to four-family homes that sold in three years,
      from the state's SR1A file: the age of what changed hands, not of every home.
    source_id: nj_sr1a
    record_type: administrative
    ranked: false

  sr1a_median_price_per_sqft:
    label: Sale price per square foot
    unit: usd
    frequency: annual
    direction: neutral
    description: >-
      The median of sale price over living area, among usable one- to four-family sales
      in three years that record their living area, from the state's SR1A file.
      Published only where 20 or more such sales do.
    source_id: nj_sr1a
    record_type: administrative

  sr1a_median_sales_ratio:
    label: Assessed value to sale price
    unit: ratio
    frequency: annual
    direction: neutral
    description: >-
      The median of the Division of Taxation's sales ratio — a home's assessed value
      over its sale price — among usable one- to four-family sales in three years. Below
      100% where assessments trail the market.
    source_id: nj_sr1a
    record_type: administrative
    ranked: false

  nj_revaluation_year:
    label: Revaluation or reassessment
    unit: year
    frequency: annual
    direction: neutral
    description: >-
      A tax year the Division of Taxation recognized a revaluation or reassessment in
      this town, bringing assessments back toward market value. Its lists begin with
      2017.
    source_id: nj_revaluations
    record_type: determination
    ranked: false

  # Milestone 39 (ARCHITECTURE #300): the end of the construction pipeline, from DCA's
  # Construction Reporter. Counts are not ranked: they would rank town size.
  nj_units_certified:
    label: Homes completed
    unit: count
    frequency: annual
    direction: higher_is_better
    description: >-
      Housing units given a certificate of occupancy in the year: complete and ready to
      live in. Only towns whose construction official reported are counted; a town that
      did not has no figure, not zero. A county's or the state's is the sum of its towns
      that reported.
    source_id: nj_construction
    record_type: administrative
    ranked: false

  nj_units_certified_1_2:
    label: Homes completed, one- and two-family
    unit: count
    frequency: annual
    direction: neutral
    description: Housing units certified in one- and two-family buildings.
    source_id: nj_construction
    record_type: administrative
    ranked: false

  nj_units_certified_multi:
    label: Homes completed, multifamily
    unit: count
    frequency: annual
    direction: neutral
    description: Housing units certified in buildings of three or more homes.
    source_id: nj_construction
    record_type: administrative
    ranked: false

  nj_units_certified_mixed:
    label: Homes completed, mixed-use
    unit: count
    frequency: annual
    direction: neutral
    description: Housing units certified in buildings that also hold shops or offices.
    source_id: nj_construction
    record_type: administrative
    ranked: false

  nj_units_demolished:
    label: Homes demolished
    unit: count
    frequency: annual
    direction: neutral
    description: >-
      Dwelling units removed by demolition permits issued in the year. Only towns that
      reported are counted.
    source_id: nj_construction
    record_type: administrative
    ranked: false

  nj_net_units_added:
    label: Net homes added
    unit: count
    frequency: annual
    direction: higher_is_better
    description: >-
      Homes completed less homes demolished, for a town that reported both that year.
      A county's or the state's sums the towns that reported both.
    source_id: nj_construction
    record_type: calculated
    ranked: false

  nj_certificates_reporting_share:
    label: Towns reporting completions
    unit: ratio
    frequency: annual
    direction: neutral
    description: >-
      The share of a county's or the state's towns whose certificates of occupancy are
      in the year's file: how much of the area a completions total covers.
    source_id: nj_construction
    record_type: calculated
    ranked: false

  nj_demolitions_reporting_share:
    label: Towns reporting demolitions
    unit: ratio
    frequency: annual
    direction: neutral
    description: >-
      The share of a county's or the state's towns whose demolitions are in the year's
      file.
    source_id: nj_construction
    record_type: calculated
    ranked: false

  nj_net_units_per_1000:
    label: Net homes added per 1,000 homes
    unit: per_1000_homes
    frequency: annual
    direction: higher_is_better
    description: >-
      Net homes added in the year per 1,000 homes already standing (ACS 5-year housing
      units ending that year): how fast a place is adding homes for its size. One large
      building moves a small town's figure a long way in a single year.
    source_id: hip_derived
    record_type: calculated
    inputs: [nj_net_units_added, acs_housing_units]
    changed: false

  # Milestone 40: flood and environmental exposure (ARCHITECTURE #301-#304). Shares of
  # homes are estimates over the 2020 Census's homes, each block's spread evenly over it.

  fema_flood_homes_share:
    label: Homes in FEMA's 1% flood zone
    unit: ratio
    frequency: annual
    direction: lower_is_better
    description: >-
      The share of homes inside FEMA's Special Flood Hazard Area, where a flood has at
      least a 1% chance each year (26% over a 30-year mortgage) and a federally backed
      mortgage requires flood insurance. Estimated from the 2020 Census's homes by
      block, against the flood map in force when read. Outside the zone is not safe:
      many flood claims come from outside it.
    source_id: fema_nfhl
    record_type: calculated
    changed: false

  fema_flood_homes_share_moderate:
    label: Homes in FEMA's 0.2% flood zone
    unit: ratio
    frequency: annual
    direction: lower_is_better
    description: >-
      The share of homes in FEMA's moderate flood hazard area, a 0.2% chance each year
      (the "500-year" flood), or behind a levee. Insurance is not required there, and
      not cheap to go without.
    source_id: fema_nfhl
    record_type: calculated
    changed: false

  fema_flood_homes:
    label: Homes in FEMA's 1% flood zone (count)
    unit: count
    frequency: annual
    direction: neutral
    description: >-
      The number of homes, as counted in 2020, estimated to be inside FEMA's 1% flood
      zone.
    source_id: fema_nfhl
    record_type: calculated
    ranked: false

  fema_mapped_homes_share:
    label: Homes FEMA's flood map determines
    unit: ratio
    frequency: annual
    direction: neutral
    description: >-
      The share of homes where FEMA's digital flood map, the National Flood Hazard
      Layer, gives a flood zone at all. The rest are in zone D, where the hazard was
      never studied, or where FEMA's map is not digital: most of Morris County, on
      2026-10-02. The zone shares are published only where this is at least 95%.
    source_id: fema_nfhl
    record_type: calculated
    ranked: false

  njdep_tidal_homes_share:
    label: Homes in the climate-adjusted tidal flood area
    unit: ratio
    frequency: annual
    direction: lower_is_better
    description: >-
      The share of homes inside NJDEP's tidal climate-adjusted flood area: FEMA's
      coastal 1% flood plus four feet of sea-level rise, the elevation New Jersey's
      2026 REAL rules plan new coastal building for. An approximate planning layer
      for 14 counties, not a flood map in force; a town elsewhere has no figure.
    source_id: njdep_cafe
    record_type: calculated
    changed: false

  fema_flood_claims:
    label: Flood insurance claims paid
    unit: count
    frequency: annual
    direction: neutral
    description: >-
      National Flood Insurance Program claims on which anything was paid, by the year
      of the flood. Only insured homes and businesses claim, so this counts insured
      loss, not every flooded home. Published by county and ZIP code; FEMA's finer
      locations do not place a claim in a town.
    source_id: fema_nfip_claims
    record_type: administrative
    ranked: false
    changed: false

  fema_flood_claims_paid:
    label: Flood insurance paid
    unit: usd
    frequency: annual
    direction: neutral
    description: >-
      What the National Flood Insurance Program paid on buildings and contents for
      floods in the year, in that year's dollars.
    source_id: fema_nfip_claims
    record_type: administrative
    ranked: false
    changed: false

  njdep_sites_open:
    label: Contaminated sites, cleanup open
    unit: count
    frequency: annual
    direction: neutral
    description: >-
      Sites on NJDEP's Known Contaminated Sites List whose remediation is under way or
      not yet begun. A count, not a measure of risk: what each site is and how near
      it is to a home is on NJDEP's own map.
    source_id: njdep_kcsl
    record_type: administrative
    ranked: false
    changed: false

  njdep_sites_post_remedy:
    label: Contaminated sites, cleaned up with controls
    unit: count
    frequency: annual
    direction: neutral
    description: >-
      Sites remediated with controls that stay in place, such as a deed notice or a
      limit on ground water use.
    source_id: njdep_kcsl
    record_type: administrative
    ranked: false
    changed: false

  njdep_sites_heating_oil:
    label: Home heating-oil tank cleanups
    unit: count
    frequency: annual
    direction: neutral
    description: >-
      Leaking home heating-oil tanks under remediation, nearly all at houses.
    source_id: njdep_kcsl
    record_type: administrative
    ranked: false
    changed: false

  water_homes_share_public:
    label: Homes on public water
    unit: ratio
    frequency: annual
    direction: neutral
    description: >-
      The share of homes inside a community water system's service area. Most of the
      rest draw from private wells, which New Jersey requires to be tested when a home
      is sold or leased.
    source_id: njdep_water_areas
    record_type: calculated
    ranked: false
    changed: false

  water_homes_share_violation:
    label: Homes on a system with a recent health-based violation
    unit: ratio
    frequency: annual
    direction: neutral
    description: >-
      The share of homes served by a community water system with at least one
      health-based violation (a contaminant over its limit, or required treatment not
      done) in the five calendar years before the year read. A period the water broke
      a rule, not a measure of the water today.
    source_id: epa_sdwis
    record_type: calculated
    ranked: false
    changed: false

  # Milestone 45: getting around (ARCHITECTURE #313-#314). Where residents work is a
  # share of their jobs in LODES; nearness to transit a share of 2020's homes by block.

  lodes_resident_jobs:
    label: Jobs held by residents
    unit: count
    frequency: annual
    direction: neutral
    description: >-
      Jobs held by people living here, wherever the job is, in the Census Bureau's LODES:
      jobs covered by unemployment insurance and federal civilian jobs. Self-employment
      and military jobs are not counted, and a person with two jobs counts twice.
    source_id: census_lodes
    record_type: administrative
    ranked: false
    changed: false

  lodes_work_same_town_share:
    label: Residents' jobs in their own town
    unit: ratio
    frequency: annual
    direction: neutral
    description: >-
      The share of residents' jobs located in the municipality they live in. Part of
      the home county's share.
    source_id: census_lodes
    record_type: calculated
    ranked: false
    changed: false

  lodes_work_home_county_share:
    label: Residents' jobs in their home county
    unit: ratio
    frequency: annual
    direction: neutral
    description: >-
      The share of residents' jobs located in the county they live in, their own town
      included. A job is placed where its employer reports it, which for a firm with
      many sites can be an office rather than where the work is done.
    source_id: census_lodes
    record_type: calculated
    ranked: false
    changed: false

  lodes_work_other_nj_share:
    label: Residents' jobs elsewhere in New Jersey
    unit: ratio
    frequency: annual
    direction: neutral
    description: >-
      The share of residents' jobs in New Jersey but outside their home county.
    source_id: census_lodes
    record_type: calculated
    ranked: false
    changed: false

  lodes_work_nyc_share:
    label: Residents' jobs in New York City
    unit: ratio
    frequency: annual
    direction: neutral
    description: >-
      The share of residents' jobs located in New York City's five boroughs.
    source_id: census_lodes
    record_type: calculated
    ranked: false
    changed: false

  lodes_work_pennsylvania_share:
    label: Residents' jobs in Pennsylvania
    unit: ratio
    frequency: annual
    direction: neutral
    description: >-
      The share of residents' jobs located in Pennsylvania, Philadelphia included.
    source_id: census_lodes
    record_type: calculated
    ranked: false
    changed: false

  lodes_work_other_state_share:
    label: Residents' jobs in other states
    unit: ratio
    frequency: annual
    direction: neutral
    description: >-
      The share of residents' jobs outside New Jersey, New York City and Pennsylvania:
      the rest of New York, Delaware, Connecticut and beyond. LODES 2023 has no records
      for Alaska and Michigan, so jobs there are not counted.
    source_id: census_lodes
    record_type: calculated
    ranked: false
    changed: false

  transit_rail_homes_share:
    label: Homes within half a mile of a rail stop
    unit: ratio
    frequency: annual
    direction: neutral
    description: >-
      The share of homes within half a mile, in a straight line, of a commuter rail,
      PATH, PATCO, subway or light rail stop, from the Bureau of Transportation
      Statistics' National Transit Map and 2020's homes by block. Nearness to a stop,
      not how often trains call there.
    source_id: bts_ntm
    record_type: calculated
    ranked: false
    changed: false

  transit_bus_homes_share:
    label: Homes within a quarter mile of a bus stop
    unit: ratio
    frequency: annual
    direction: neutral
    description: >-
      The share of homes within a quarter mile, in a straight line, of a bus stop. A
      stop served once a day counts the same as one served every ten minutes.
    source_id: bts_ntm
    record_type: calculated
    ranked: false
    changed: false

  transit_any_homes_share:
    label: Homes near any transit stop
    unit: ratio
    frequency: annual
    direction: neutral
    description: >-
      The share of homes within half a mile of a rail stop or a quarter mile of a bus
      stop.
    source_id: bts_ntm
    record_type: calculated
    ranked: false
    changed: false
