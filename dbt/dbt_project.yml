# dbt owns warehouse transforms; the Typer CLI owns acquisition and loading
# (ARCHITECTURE #4). Staging models read the Parquet tier through DuckDB; marts build
# the fact and dimension tables that the loader promotes to Postgres.

name: hip
version: 0.1.0
config-version: 2
profile: hip

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  hip:
    staging:
      # Views: staging is renaming and typing, not storage. Cheap to rebuild.
      +materialized: view
      +schema: staging
    marts:
      # Tables: read repeatedly by analytics and by the Postgres loader.
      +materialized: table
      +schema: marts
