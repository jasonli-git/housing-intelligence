version: 2

models:
  - name: stg_zillow_zhvi
    description: >-
      Zillow Home Value Index in long form. One row per (geography, month) with a
      non-null value. Geography is unresolved here — `fips_key` is populated only for
      counties, because Zillow publishes no FIPS at city or ZIP level.
    columns:
      - name: source_id
        tests: [not_null]
      - name: layer
        tests:
          - not_null
          - accepted_values: {values: ['county', 'city', 'zip']}
      - name: region_name
        tests: [not_null]
      - name: state_code
        tests: [not_null]
      - name: period_start
        tests: [not_null]
      - name: value
        tests:
          - not_null
          # A home value index outside this range means the file changed shape or the
          # unpivot picked up a non-value column.
          - accepted_range:
              min_value: 1000
              max_value: 100000000

  - name: stg_zillow_zori
    description: >-
      Zillow Observed Rent Index in long form, same shape as ZHVI. Coverage is thinner:
      ZORI needs enough active listings, so small geographies are frequently absent.
    columns:
      - name: source_id
        tests: [not_null]
      - name: layer
        tests:
          - not_null
          - accepted_values: {values: ['county', 'city', 'zip']}
      - name: region_name
        tests: [not_null]
      - name: period_start
        tests: [not_null]
      - name: value
        tests:
          - not_null
          - accepted_range:
              min_value: 100
              max_value: 100000

  # Milestone 21. Keyed models: the geoid is exact, so the tests guard the shape of the
  # files — a moved column shows up as nulls or out-of-range values here, before the
  # gate or the warehouse sees it.
  - name: stg_census_acs
    description: >-
      ACS income, rent, population, home value and renter cost burden, county and
      municipal, each with its 90% margin of error (Milestone 28).
    columns:
      - name: geoid
        tests: [not_null]
      - name: value
        tests: [not_null]
      # A margin is never negative: the Census's negative codes are read as NULL, or 0
      # for a controlled estimate. No upper bound — a share over a handful of renters
      # can have a margin wider than the share itself, which is the finding, not a bug.
      - name: margin_of_error
        tests:
          - accepted_range: {min_value: 0, max_value: 1.0e+15}

  - name: stg_census_acs_housing
    description: ACS vacancy (B25002) and homeownership (B25003) rates, county and municipal.
    columns:
      - name: geoid
        tests: [not_null]
      - name: release_layer
        tests:
          - accepted_values: {values: ['housing_county', 'housing_cousub']}
      - name: value
        tests:
          - not_null
          - accepted_range: {min_value: 0, max_value: 1}
      - name: margin_of_error
        tests:
          - accepted_range: {min_value: 0, max_value: 1.0e+15}

  - name: stg_census_acs_costs
    description: >-
      ACS homeowners insurance (B25141), utility bills (B25132-B25135) and renters paying
      utilities on top of rent (B25069), county and municipal; medians interpolated from
      the published brackets (Milestone 33).
    columns:
      - name: geoid
        tests: [not_null]
      - name: release_layer
        tests:
          - accepted_values:
              values: ['insurance_county', 'insurance_cousub',
                       'utilities_county', 'utilities_cousub']
      - name: value
        tests:
          - not_null
          - accepted_range: {min_value: 0, max_value: 1.0e+6}

  - name: stg_census_permits_place
    description: Building permits by place, resolved to municipal GEOIDs by FIPS MCD code.
    columns:
      - name: geoid
        tests: [not_null]
      - name: value
        tests:
          - not_null
          - accepted_range: {min_value: 0, max_value: 1000000}

  - name: stg_hud_fmr
    description: Two-bedroom Fair Market Rent per county per fiscal year.
    columns:
      - name: geoid
        tests: [not_null]
      - name: value
        tests:
          - not_null
          - accepted_range: {min_value: 100, max_value: 20000}

  - name: stg_hud_chas
    description: HUD CHAS owner and renter cost burden, county and municipal, one vintage.
    columns:
      - name: geoid
        tests: [not_null]
      - name: value
        tests:
          - not_null
          - accepted_range: {min_value: 0, max_value: 1}
