version: 2

models:
  - name: stg_zillow_zhvi
    description: >-
      Zillow Home Value Index in long form. One row per (geography, month) with a
      non-null value. Geography is unresolved here — `fips_key` is populated only for
      counties, because Zillow publishes no FIPS at city or ZIP level.
    columns:
      - name: source_id
        tests: [not_null]
      - name: layer
        tests:
          - not_null
          - accepted_values: {values: ['county', 'city', 'zip']}
      - name: region_name
        tests: [not_null]
      - name: state_code
        tests: [not_null]
      - name: period_start
        tests: [not_null]
      - name: value
        tests:
          - not_null
          # A home value index outside this range means the file changed shape or the
          # unpivot picked up a non-value column.
          - accepted_range:
              min_value: 1000
              max_value: 100000000

  - name: stg_zillow_zori
    description: >-
      Zillow Observed Rent Index in long form, same shape as ZHVI. Coverage is thinner:
      ZORI needs enough active listings, so small geographies are frequently absent.
    columns:
      - name: source_id
        tests: [not_null]
      - name: layer
        tests:
          - not_null
          - accepted_values: {values: ['county', 'city', 'zip']}
      - name: region_name
        tests: [not_null]
      - name: period_start
        tests: [not_null]
      - name: value
        tests:
          - not_null
          - accepted_range:
              min_value: 100
              max_value: 100000

  # Milestone 21. Keyed models: the geoid is exact, so the tests guard the shape of the
  # files — a moved column shows up as nulls or out-of-range values here, before the
  # gate or the warehouse sees it.
  - name: stg_census_acs
    description: >-
      ACS income, rent, population, home value and renter cost burden, county,
      municipal and ZCTA, each with its 90% margin of error (Milestone 28; ZCTA since 34).
    columns:
      - name: geoid
        tests: [not_null]
      - name: value
        tests: [not_null]
      # A margin is never negative: the Census's negative codes are read as NULL, or 0
      # for a controlled estimate. No upper bound — a share over a handful of renters
      # can have a margin wider than the share itself, which is the finding, not a bug.
      - name: margin_of_error
        tests:
          - accepted_range: {min_value: 0, max_value: 1.0e+15}

  - name: stg_census_acs_housing
    description: >-
      ACS vacancy (B25002) and homeownership (B25003) rates, county, municipal and ZCTA.
    columns:
      - name: geoid
        tests: [not_null]
      - name: release_layer
        tests:
          - accepted_values:
              values: ['housing_county', 'housing_cousub', 'housing_zcta']
      - name: value
        tests:
          - not_null
          - accepted_range: {min_value: 0, max_value: 1}
      - name: margin_of_error
        tests:
          - accepted_range: {min_value: 0, max_value: 1.0e+15}

  - name: stg_census_acs_costs
    description: >-
      ACS homeowners insurance (B25141), utility bills (B25132-B25135) and renters paying
      utilities on top of rent (B25069), county, municipal and ZCTA; medians interpolated
      from the published brackets (Milestone 33).
    columns:
      - name: geoid
        tests: [not_null]
      - name: release_layer
        tests:
          - accepted_values:
              values: ['insurance_county', 'insurance_cousub', 'insurance_zcta',
                       'utilities_county', 'utilities_cousub', 'utilities_zcta']
      - name: value
        tests:
          - not_null
          - accepted_range: {min_value: 0, max_value: 1.0e+6}

  - name: stg_census_acs_homes
    description: >-
      The ACS in depth on the homes (Milestone 34): rent by bedrooms and its quartiles,
      owner costs, severe burden, building type, age, bedrooms, crowding, plumbing and
      kitchens, vacancy by reason and heating fuel; county, municipal and ZCTA.
    columns:
      - name: geoid
        tests: [not_null]
      - name: release_layer
        tests:
          - accepted_values:
              values: ['rent_county', 'rent_cousub', 'rent_zcta',
                       'stock_county', 'stock_cousub', 'stock_zcta',
                       'rooms_county', 'rooms_cousub', 'rooms_zcta',
                       'vacancy_county', 'vacancy_cousub', 'vacancy_zcta']
      # Dollars, a year, a household size or a share: none negative, none past $1m.
      - name: value
        tests:
          - not_null
          - accepted_range: {min_value: 0, max_value: 1.0e+6}
      - name: margin_of_error
        tests:
          - accepted_range: {min_value: 0, max_value: 1.0e+15}

  - name: stg_census_acs_people
    description: >-
      The ACS in depth on the people (Milestone 34): how and how long workers commute,
      household types and disability; county, municipal and ZCTA.
    columns:
      - name: geoid
        tests: [not_null]
      - name: release_layer
        tests:
          - accepted_values:
              values: ['people_county', 'people_cousub', 'people_zcta',
                       'disability_county', 'disability_cousub', 'disability_zcta']
      - name: value
        tests:
          - not_null
          - accepted_range: {min_value: 0, max_value: 1000}
      - name: margin_of_error
        tests:
          - accepted_range: {min_value: 0, max_value: 1.0e+15}

  - name: stg_census_permits_place
    description: Building permits by place, resolved to municipal GEOIDs by FIPS MCD code.
    columns:
      - name: geoid
        tests: [not_null]
      - name: value
        tests:
          - not_null
          - accepted_range: {min_value: 0, max_value: 1000000}

  - name: stg_hud_fmr
    description: >-
      Fair Market Rent per county per fiscal year, studio to four bedrooms (two-bedroom
      since Milestone 21, every size since 35).
    columns:
      - name: geoid
        tests: [not_null]
      - name: value
        tests:
          - not_null
          - accepted_range: {min_value: 100, max_value: 20000}

  - name: stg_hud_safmr
    description: >-
      HUD Small Area Fair Market Rents by ZIP, studio to four bedrooms, where HUD sets
      them (Milestone 35).
    columns:
      - name: geoid
        tests: [not_null]
      - name: value
        tests:
          - not_null
          - accepted_range: {min_value: 100, max_value: 20000}

  - name: stg_hud_chas
    description: HUD CHAS owner and renter cost burden, county and municipal, one vintage.
    columns:
      - name: geoid
        tests: [not_null]
      - name: value
        tests:
          - not_null
          - accepted_range: {min_value: 0, max_value: 1}

  - name: stg_hud_income_limit_lines
    description: >-
      HUD income limits for households of one to eight at 30%, 50% and 80% of area
      median income, per county and fiscal year (Milestone 35).
    columns:
      - name: geoid
        tests: [not_null]
      - name: band
        tests:
          - accepted_values: {values: [30, 50, 80], quote: false}
      - name: household_size
        tests:
          - accepted_range: {min_value: 1, max_value: 8}
      - name: income_limit
        tests:
          - not_null
          - accepted_range: {min_value: 1000, max_value: 1000000}
