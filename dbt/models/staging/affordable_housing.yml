  - name: stg_hud_lihtc_records
    columns:
      - name: geoid
        tests: [not_null]
      - name: record_id
        tests: [unique, not_null]
      - name: snapshot
        tests: [not_null]
  - name: stg_nj_affordable
    columns:
      - name: geoid
        tests: [not_null]
      - name: value
        tests: [not_null]
